<title>MédiParc NFC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : appli plein écran en une colonne (430 pt, iPhone 15 Pro Max) — en-tête, contenu défilant, barre d'onglets flottante avec bouton de scan central ; fiches et feuilles glissent par-dessus. */
:root{
  --bg:#EDF6F8; --bg-top:#C9EBF2; --hero2:#0E8F93; --deco:1; --glow:rgba(11,110,125,.30); --surface:#FFFFFF; --surface-2:#E2EAEC; --ink:#0D2730; --muted:#5B7078; --line:#D5DFE1;
  --accent:#0A7C88; --accent-ink:#FFFFFF; --accent-soft:#D8EEF2;
  --hero:#0B5361; --hero-fg:#F2FAFB; --hero-muted:#A9CBD2; --hero-track:#1D5360;
  --ok:#1A7F54; --ok-soft:#DCF2E6; --warn:#A65F00; --warn-soft:#FBEBD0;
  --crit:#B8352B; --crit-soft:#FADFDC; --info:#3154C4; --info-soft:#E0E7FB;
  --seg-loc:#7FA0FF; --seg-dispo:#5FD6A0; --seg-desinf:#F5BE6B; --seg-maint:#FF9288;
  --shadow:0 1px 2px rgba(13,39,48,.06),0 8px 24px rgba(13,39,48,.07);
  --scrim:rgba(6,22,28,.45);
  --f-display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-text:"Inter",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07181E; --bg-top:#0D2D38; --hero2:#1A6E78; --deco:.55; --glow:rgba(0,0,0,.45); --surface:#0F252D; --surface-2:#17333C; --ink:#E8F1F2; --muted:#8FA6AD; --line:#21404A;
  --accent:#4CC3D9; --accent-ink:#04222A; --accent-soft:#123C47;
  --hero:#123E4A; --hero-fg:#F2FAFB; --hero-muted:#9DC3CB; --hero-track:#0A2A33;
  --ok:#5AD39A; --ok-soft:#10382A; --warn:#F2B45A; --warn-soft:#3B2B0E;
  --crit:#FF8A7E; --crit-soft:#42201C; --info:#93ABFF; --info-soft:#1B2955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.6);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#07181E; --bg-top:#0D2D38; --hero2:#1A6E78; --deco:.55; --glow:rgba(0,0,0,.45); --surface:#0F252D; --surface-2:#17333C; --ink:#E8F1F2; --muted:#8FA6AD; --line:#21404A;
  --accent:#4CC3D9; --accent-ink:#04222A; --accent-soft:#123C47;
  --hero:#123E4A; --hero-fg:#F2FAFB; --hero-muted:#9DC3CB; --hero-track:#0A2A33;
  --ok:#5AD39A; --ok-soft:#10382A; --warn:#F2B45A; --warn-soft:#3B2B0E;
  --crit:#FF8A7E; --crit-soft:#42201C; --info:#93ABFF; --info-soft:#1B2955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--bg-top),var(--bg) 300px)}
.deco{position:absolute;top:0;left:0;right:0;height:190px;pointer-events:none;opacity:var(--deco)}
.deco svg{width:100%;height:100%;display:block}
.top,main,.tabs{position:relative;z-index:1}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 14px}
.top .eyebrow{font-size:15px;color:var(--muted)}
.top .eyebrow::first-letter{text-transform:uppercase}
.top .eyebrow.up{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.top h1{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.demo-tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);padding:9px 14px;border-radius:99px;white-space:nowrap;box-shadow:var(--shadow);margin-bottom:6px}
.demo-tag svg{color:var(--accent)}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 20px;display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;min-height:34px}
.sec-h h2{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.015em}
.sec-h h2 svg{color:var(--accent);width:24px;height:24px}
.sec-h>span{font-size:13px;color:var(--muted)}
.sec-h .badge{min-width:30px;height:30px;padding:0 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center}
.sec-h .more{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:99px}

/* Carte parc */
.hero{background:radial-gradient(120% 90% at 85% 0%,var(--hero2),transparent 60%),linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);border-radius:28px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 16px 32px -8px var(--glow)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:-8px}
.hero .lbl{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--hero-fg);margin-bottom:6px}
.hero .lbl svg{width:24px;height:24px}
.hero .big{font-family:var(--f-display);font-size:60px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .big small{font-size:32px;font-weight:700;margin-left:6px}
.hero .side{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--hero-muted);border-left:1px solid rgba(255,255,255,.22);padding:6px 0 6px 18px}
.hero .side svg{width:26px;height:26px;color:var(--hero-fg)}
.hero .side b{display:block;font-family:var(--f-display);font-size:21px;color:var(--hero-fg);font-weight:700;white-space:nowrap}
.segbar{display:flex;gap:3px;height:14px}
.segbar i{border-radius:7px;min-width:6px;transition:flex-grow .5s ease}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.legend button{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--hero-fg)}
.legend b{margin-left:auto;color:var(--hero-fg);font-weight:700;font-size:16px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}

/* Lignes */
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;min-height:72px}
.row:active,.mini:active,.pick:active{background:var(--surface-2)}
.row + .row{border-top:1px solid var(--line)}
.row .body{flex:1;min-width:0}
.row .t{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.row .s.si{display:flex;align-items:center;gap:6px;margin-top:2px}
.row .s.si{white-space:normal;align-items:flex-start}
.row .s.si svg{margin-top:1px}
.row .s.si span{min-width:0}
.row .pill+.chev{margin-left:-6px}
.row .pill{padding:6px 10px}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t.wrap{white-space:normal;font-weight:500;font-size:14px}
.row .chev{color:var(--muted);flex:none;opacity:.6}
.ico{width:52px;height:52px;border-radius:16px;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;flex:none}
.ico svg,.tab svg,.btn svg,.chev svg,.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.a-crit{background:var(--crit-soft);color:var(--crit)} .ico.a-warn{background:var(--warn-soft);color:var(--warn)}
.ico.a-info{background:var(--info-soft);color:var(--info)} .ico.a-ok{background:var(--ok-soft);color:var(--ok)}
.ph{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface-2);display:block}
.ph img,.pic img{width:100%;height:100%;object-fit:cover;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .pic{position:relative;display:block;aspect-ratio:4/3;background:var(--surface-2)}
.card .pic img{position:absolute;inset:0}
main>*{flex:none}
.card .pic .pill{position:absolute;left:8px;top:8px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.card .meta{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;min-width:0}
.card .t{font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ft{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px}
.card .dt{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt svg{color:var(--accent);width:15px;height:15px}
.card .pxc{flex:none;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:5px 8px;border-radius:9px;white-space:nowrap}
.card .px{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--accent);margin-top:2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:var(--gl);margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding:2px var(--gr) 14px var(--gl);margin-bottom:-14px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{flex:none;width:156px;scroll-snap-align:start}
.credits{align-self:center;font-size:13px;color:var(--muted);text-decoration:underline;padding:8px}
.cred{font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.cred b{display:block;font-weight:600}.cred span{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;flex:none}
.p-loc{background:var(--info-soft);color:var(--info)} .p-dispo{background:var(--ok-soft);color:var(--ok)}
.p-desinf{background:var(--warn-soft);color:var(--warn)} .p-maint{background:var(--crit-soft);color:var(--crit)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* Recherche et filtres */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:20px;padding:0 6px 0 16px;box-shadow:var(--shadow);color:var(--accent);min-height:54px}
.sbtn{width:42px;height:42px;display:grid;place-items:center;color:var(--muted);border-radius:12px}
.sbtn svg{width:24px;height:24px}
.search>svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:12px 0;outline:none}
.chips{display:flex;gap:10px;overflow-x:auto;padding-block:4px 12px;margin-block:-4px -12px;scrollbar-width:none;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:10px 15px;border-radius:99px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip svg{color:var(--accent);width:18px;height:18px}
.chip[aria-pressed="true"]{background:linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg)}
.chip[aria-pressed="true"] svg{color:inherit}

/* Locations */
.pcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px 14px 14px 12px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--pc)}
.pcard header{display:flex;align-items:center;gap:10px}
.pcard .who{flex:1;min-width:0}
.pcard .who .t{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2}
.pcard .who .s{font-size:12.5px;color:var(--muted)}
.pcard .pill{font-size:11.5px;padding:4px 8px}
.avatar{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--pc,var(--accent)) 16%,var(--surface));color:var(--pc,var(--accent));display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.pcard .amt{flex:none;text-align:right;font-family:var(--f-display);font-weight:700;font-size:15px;border-left:1px solid var(--line);padding-left:10px;white-space:nowrap}
.pcard .amt small{display:block;font-family:var(--f-text);font-weight:400;font-size:12px;color:var(--muted)}
.mini .ph{width:58px;height:44px;border-radius:10px}
.mini{display:flex;align-items:center;gap:12px;width:100%;padding:7px 8px 7px 7px;border-radius:14px;background:var(--bg);font-size:14px}
.mini .chev{color:var(--ink);flex:none}
.mini .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mini .nm b{font-family:var(--f-display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .when{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.stat2{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.stat2>div{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 12px;min-width:0}
.stat2>div>svg{width:30px;height:30px;color:var(--accent)}
.stat2 .st-a{background:linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);box-shadow:0 14px 26px -10px var(--glow)}
.stat2 .st-a>svg,.stat2 .st-a span{color:var(--hero-fg)}
.banner{display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);border-radius:24px;padding:16px 6px;box-shadow:0 14px 26px -10px var(--glow)}
.banner>div{display:flex;align-items:center;gap:12px;padding:2px 14px}
.banner>div+div{border-left:1px solid rgba(255,255,255,.25)}
.banner svg{width:32px;height:32px}
.banner b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.banner span{font-size:13px}
.stat2 b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.stat2 span{font-size:12.5px;color:var(--muted)}

/* Barre d'onglets */
.tabs{flex:none;margin:0 var(--gr) 8px var(--gl);background:var(--surface);border-radius:32px;box-shadow:0 10px 30px -6px var(--glow),var(--shadow);display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:center;padding:7px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;font-size:12px;font-weight:600;color:var(--muted);border-radius:24px;transition:background .2s,color .2s}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.scanbtn{justify-self:center;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 25%,var(--hero2),var(--accent) 70%);color:var(--hero-fg);display:grid;place-items:center;margin-top:-30px;box-shadow:0 0 0 6px var(--surface),0 12px 26px var(--glow);transition:transform .15s}
.scanbtn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.scanbtn:active{transform:scale(.95)}

/* Fiche équipement */
.detail{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:20;visibility:hidden}
.detail.open{transform:none;visibility:visible}
.back{position:absolute;top:12px;left:var(--gl);z-index:3;width:42px;height:42px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.dhero{position:relative;height:320px;flex:none;overflow:hidden;background:var(--hero)}
.dhero .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(24px) brightness(.75)}
.dhero img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.dhero .pill{position:absolute;right:var(--gr);top:16px;font-size:14px;padding:8px 14px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.dbody{display:flex;flex-direction:column;gap:18px;padding-block:18px 16px;background:var(--bg);border-radius:26px 26px 0 0;margin-top:-24px;position:relative}
.dscroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.dhead h2{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.dhead p{color:var(--muted);font-size:14px;margin-top:2px}
.tagcard{background:linear-gradient(120deg,var(--hero),var(--hero2));color:var(--hero-fg);border-radius:22px;padding:15px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 24px -10px var(--glow)}
.tagcard .cp{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;margin-right:-6px}
.tagcard .cp svg{width:20px;height:20px}
.tagcard svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.tagcard small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-muted);font-weight:600}
.tagcard code{font-family:var(--f-mono);font-size:14px;letter-spacing:.02em}
.tagcard .ref{margin-left:auto;text-align:right}
.kv{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:2px 16px}
.kv div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;font-size:15px;min-height:50px}
.kv div + div{border-top:1px solid var(--line)}
.kv dt{display:flex;align-items:center;gap:12px;color:var(--muted)} .kv dt svg{color:var(--accent);width:22px;height:22px} .kv dd{margin:0;font-weight:600;text-align:right}
.kv dd .pill{font-size:14px;padding:5px 12px}
.kv .late{color:var(--crit)}
.tl{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column}
.tl li{position:relative;padding:0 0 12px 24px;font-size:14.5px}
.tl li::before{content:"";position:absolute;left:0;top:4px;width:11px;height:11px;border-radius:50%;background:var(--line)}
.tl li.first::before{background:var(--accent)}
.tl li::after{content:"";position:absolute;left:5px;top:17px;bottom:-3px;width:1px;background:var(--line)}
.tl li:last-child{padding-bottom:0}.tl li:last-child::after{display:none}
.tl time{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.evt{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;border-bottom:1px solid var(--line)}
.evt svg.i{width:22px;height:22px;color:var(--muted)}
.evt span{flex:1;min-width:0}
.first .evt{background:var(--ok-soft);border-bottom:0}
.first .evt svg.i{color:var(--ok)}
.evt .ok{width:22px;height:22px;flex:none;color:var(--ok)}
.actions{flex:none;display:flex;gap:10px;padding-block:12px 10px;border-top:1px solid var(--line);background:var(--bg)}
.actions .btn{flex:1;min-width:0;white-space:nowrap;font-size:15px;gap:6px;padding:0 8px;letter-spacing:-.01em}
.actions .btn svg{width:20px;height:20px;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:18px;font-family:var(--f-display);font-weight:600;font-size:16px;background:linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);box-shadow:0 10px 20px -8px var(--glow)}
.btn.soft{box-shadow:none;font-family:var(--f-text)}
.actions .btn.danger{flex:none;width:auto;box-shadow:none;background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit);font-size:13px;padding:0 10px}
.btn.danger svg{width:20px;height:20px}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn:active{opacity:.85}

/* Feuilles */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:30}
.scrim.open{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding-block:10px 20px;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);z-index:31;display:flex;flex-direction:column;gap:14px;max-height:86%;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.02em;text-align:center}
.sheet p.sub{text-align:center;color:var(--muted);font-size:14px;max-width:30ch;align-self:center}
.radar{position:relative;width:190px;height:190px;align-self:center;display:grid;place-items:center;margin:6px 0}
.radar span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ping 2.1s ease-out infinite}
.radar span:nth-child(2){animation-delay:.7s}.radar span:nth-child(3){animation-delay:1.4s}
.radar .core{box-sizing:border-box;width:92px;height:92px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:background .25s,transform .25s}
.radar .core svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.radar.found span{animation:none}
.radar.found .core{background:var(--ok);color:var(--surface);transform:scale(1.35);padding:4px;overflow:hidden}
.radar .core img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
@keyframes ping{0%{transform:scale(.48);opacity:.75}100%{transform:scale(1);opacity:0}}
.sheet .plist{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;background:var(--bg)}
.pick .body{flex:1;min-width:0}.pick .t{font-weight:600}.pick .s{font-size:13px;color:var(--muted)}

.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:40;transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  var tot=equip.length,nLoc=count('loc'),occ=Math.round(nLoc/tot*100);
  var rev=equip.filter(function(e){return e.st==='loc';}).reduce(function(a,e){return a+e.px;},0);
  var seg=['loc','dispo','desinf','maint'].map(function(s){return '<i style="flex-grow:'+count(s)+';background:var('+STATUS[s].seg+')"></i>';}).join('');
  var leg=['loc','dispo','desinf','maint'].map(function(s){return '<button data-filter="'+s+'"><span class="dot" style="background:var('+STATUS[s].seg+')"></span>'+STATUS[s].l+'<b class="num">'+count(s)+'</b></button>';}).join('');
  var al=[];
  equip.forEach(function(e){
    if(e.chk<0)al.push('<button class="row" data-open="'+e.id+'"><span class="ico a-crit"><svg viewBox="0 0 24 24">'+ICON.clock+'</svg></span><span class="body"><div class="t">Contrôle en retard de '+(-e.chk)+' j</div><div class="s">'+esc(e.n)+' · '+e.ref+'</div></span><span class="chev">'+ICON.chev+'</span></button>');
  });
  equip.forEach(function(e){
    if(e.st==='loc'&&e.end===0)al.push('<button class="row" data-open="'+e.id+'"><span class="ico a-info"><svg viewBox="0 0 24 24">'+ICON.ret+'</svg></span><span class="body"><div class="t">Retour prévu aujourd\'hui</div><div class="s">'+esc(e.n)+' · '+esc(pat(e.pt).n)+'</div></span><span class="chev">'+ICON.chev+'</span></button>');
  });
  var nd=count('desinf');
  if(nd)al.push('<button class="row" data-tab="ent"><span class="ico a-warn"><svg viewBox="0 0 24 24">'+ICON.drop+'</svg></span><span class="body"><div class="t">'+nd+' désinfection'+(nd>1?'s':'')+' en attente</div><div class="s">À valider avant remise en stock</div></span><span class="chev">'+ICON.chev+'</span></button>');
  var dispo=equip.filter(function(e){return e.st==='dispo';});
  var acts=[];
  equip.forEach(function(e){e.h.forEach(function(h){acts.push({e:e,h:h});});});
  acts.sort(function(a,b){return b.h.d-a.h.d||b.h.q-a.h.q;});
  var act=acts.slice(0,5).map(function(a){return '<button class="row" data-open="'+a.e.id+'">'+ph(a.e)+'<span class="body"><div class="t wrap">'+esc(a.h.txt)+'</div><div class="s">'+a.e.ref+' · '+rel(a.h.d)+'</div></span></button>';}).join('');
  return '<div class="hero"><div class="lbl">'+ic('lit')+'Taux d\'occupation du parc</div><div class="hero-top"><div><div class="big num">'+occ+'<small>%</small></div></div>'
    +'<div class="side">'+ic('coins')+'<div><b class="num">'+xpf(rev)+'</b>par semaine</div></div></div><div class="segbar">'+seg+'</div><div class="legend">'+leg+'</div></div>'
    +'<section>'+secH('clip','À traiter',badge(al.length))+'<div class="list">'+(al.join('')||'<div class="empty">Rien à signaler, le parc est à jour.</div>')+'</div></section>'
    +(dispo.length?'<section>'+secH('lit','Prêt à louer','<button class="more" data-filter="dispo">Tout voir'+ic('arrow')+'</button>')+'<div class="hscroll">'+dispo.map(function(e){return card(e,xpf(e.px)+' / semaine');}).join('')+'</div></section>':'')
    +'<section>'+secH('hist','Activité récente')+'<div class="list">'+act+'</div></section>';
}
function viewParc(){
  var CI={all:'grid',loc:'lit',dispo:'okc',desinf:'drop',maint:'gear'};
  var chips=[['all','Tout']].concat(Object.keys(STATUS).map(function(s){return [s,STATUS[s].l];})).map(function(c){
    var n=c[0]==='all'?equip.length:count(c[0]);
    return '<button class="chip" data-filter="'+c[0]+'" aria-pressed="'+(S.filter===c[0])+'">'+ic(CI[c[0]])+c[1]+' · '+n+'</button>';}).join('');
  return '<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4 4"/></svg><input id="q" type="search" placeholder="Nom, référence ou patient" value="'+esc(S.q)+'" autocomplete="off" aria-label="Rechercher un équipement"><button class="sbtn" data-act="scan" aria-label="Scanner une puce">'+ic('frame')+'</button></div>'
    +'<div class="chips">'+chips+'</div><div class="grid" id="parc-list">'+parcRows()+'</div><button class="credits" data-act="credits">Crédits photos</button>';
}
function parcRows(){
  var q=S.q.trim().toLowerCase();
  var r=equip.filter(function(e){
    if(S.filter!=='all'&&e.st!==S.filter)return false;
    if(!q)return true;
    return (e.n+' '+e.ref+' '+e.m+' '+(e.pt?pat(e.pt).n:'')).toLowerCase().indexOf(q)>=0;
  }).map(function(e){
    return card(e,null,'<span class="ft"><span class="dt">'+ic('cal')+(e.since===0?'Aujourd\'hui':fmt(e.since))+'</span><span class="pxc num">'+xpf(e.px)+'</span></span>');
  }).join('');
  return r||'<div class="empty" style="grid-column:1/-1">Aucun équipement ne correspond.</div>';
}
function viewLoc(){
  var rented=equip.filter(function(e){return e.st==='loc';});
  var rev=rented.reduce(function(a,e){return a+e.px;},0);
  var PC=['--accent','--ok','--info','--warn','--info'];
  var cards=patients.map(function(p,i){
    var it=rented.filter(function(e){return e.pt===p.id;});
    if(!it.length)return '';
    var sum=it.reduce(function(a,e){return a+e.px;},0);
    var back=it.some(function(e){return e.end===0;});
    return '<article class="pcard" style="--pc:var('+PC[i%PC.length]+')"><header><span class="avatar">'+initials(p.n)+'</span><div class="who"><div class="t">'+esc(p.n)+'</div><div class="s">'+esc(p.z)+'</div></div>'
      +(back?'<span class="pill p-loc">'+ic('ret')+'Retour auj.</span>':'<span class="pill p-dispo">'+ic('okc')+'Actif</span>')
      +'<div class="amt num">'+xpf(sum)+'<small>/ semaine</small></div></header>'
      +it.map(function(e){return '<button class="mini" data-open="'+e.id+'">'+ph(e)+'<span class="nm"><b>'+esc(e.n)+'</b><span class="when">'+ic('cal')+(e.end===0?'Retour aujourd\'hui':'Depuis le '+fmt(e.since))+'</span></span><span class="chev">'+ICON.chev+'</span></button>';}).join('')+'</article>';
  }).join('');
  var np=patients.filter(function(p){return rented.some(function(e){return e.pt===p.id;});}).length;
  return '<div class="stat2"><div class="st-a">'+ic('coins')+'<div><b class="num">'+xpf(rev)+'</b><span>Loyers par semaine</span></div></div><div>'+ic('users')+'<div><b class="num">'+np+'</b><span>Bénéficiaires équipés</span></div></div></div>'
    +'<section>'+secH('clip','Contrats en cours','<span>'+rented.length+' équipements</span>')+(cards||'<div class="list"><div class="empty">Aucune location en cours.</div></div>')+'</section>';
}
function rowE(e,sub,right){
  return '<button class="row" data-open="'+e.id+'">'+ph(e)+'<span class="body"><div class="t">'+esc(e.n)+'</div><div class="s si">'+ic('cal')+'<span>'+esc(sub)+'</span></div></span>'+right+'<span class="chev">'+ICON.chev+'</span></button>';
}
function viewEnt(){
  function block(k,t,arr,empty,sub){return '<section>'+secH(k,t,badge(arr.length))+'<div class="list">'+(arr.map(function(e){return rowE(e,sub(e),pill(e));}).join('')||'<div class="empty">'+empty+'</div>')+'</div></section>';}
  var de=equip.filter(function(e){return e.st==='desinf';}),ma=equip.filter(function(e){return e.st==='maint';});
  var ck=equip.filter(function(e){return e.chk<=30;}).sort(function(a,b){return a.chk-b.chk;});
  return '<div class="banner"><div>'+ic('tool')+'<div><b class="num">'+ck.length+'</b><span>Contrôles à venir</span></div></div><div>'+ic('warn')+'<div><b class="num">'+(de.length+ma.length)+'</b><span>Actions en cours</span></div></div></div>'
    +block('drop','Désinfection en attente',de,'Aucun matériel en zone de lavage.',function(e){return e.ref+' · retour '+rel(e.since).toLowerCase();})
    +block('tool','En maintenance',ma,'Aucun matériel à l\'atelier.',function(e){return e.ref+' · depuis le '+fmt(e.since);})
    +'<section>'+secH('cal','Prochains contrôles')+'<div class="list">'+(ck.map(function(e){
      var c=e.chk<0?['p-maint','clock','Retard '+(-e.chk)+' j']:e.chk<=14?['p-desinf','clock','Dans '+e.chk+' j']:['p-acc','cal',fmt(e.chk)];
      return rowE(e,e.ref+' · contrôle de sécurité','<span class="pill '+c[0]+'">'+ic(c[1])+c[2]+'</span>');}).join('')||'<div class="empty">Aucun contrôle dans les 30 jours.</div>')+'</div></section>';
}
var VIEWS={home:['',"Aujourd'hui",viewHome],parc:['Inventaire','Parc matériel',viewParc],loc:['Patients','Locations',viewLoc],ent:['Atelier','Entretien',viewEnt]};
function render(keepScroll){
  var v=VIEWS[S.tab],y=main.scrollTop;
  $('eyebrow').textContent=v[0]||new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  $('eyebrow').className='eyebrow'+(v[0]?' up':'');
  $('title').textContent=v[1];
  main.innerHTML=v[2]();
  main.scrollTop=keepScroll?y:0;
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){if(tabs[i].dataset.tab===S.tab)tabs[i].setAttribute('aria-current','page');else tabs[i].removeAttribute('aria-current');}
}

/* ---------- Fiche ---------- */
function renderDetail(){
  var e=byId(S.cur);if(!e)return;
  var p=e.pt?pat(e.pt):null,acts='';
  if(e.st==='dispo')acts='<button class="btn" data-act="assign">'+svg('cal')+'Mettre en location</button>';
  else if(e.st==='loc')acts='<button class="btn" data-act="return">'+svg('ret')+'Enregistrer le retour</button>';
  else if(e.st==='desinf')acts='<button class="btn" data-act="clean">'+ICON.check+'Valider la désinfection</button>';
  else acts='<button class="btn" data-act="repair">'+ICON.check+'Clôturer la maintenance</button>';
  if(e.st!=='maint')acts+='<button class="btn danger" data-act="fault">'+svg('warn')+'Signaler une panne</button>';
  var chk=e.chk<0?'<dd class="late">En retard de '+(-e.chk)+' j</dd>':'<dd>'+dateOf(e.chk).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'</dd>';
  var hist=e.h.slice().sort(function(a,b){return b.d-a.d||b.q-a.q;}).map(function(h,i){return '<li'+(i?'':' class="first"')+'><time>'+rel(h.d)+'</time><div class="evt">'+ic(hIcon(h.txt))+'<span>'+esc(h.txt)+'</span>'+(i?'':OKC)+'</div></li>';}).join('');
  detail.innerHTML='<button class="back" data-act="back" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>'
    +'<div class="dscroll"><div class="dhero"><div class="bg" style="background-image:url('+src(e)+')"></div><img src="'+src(e)+'" alt="'+esc(e.n)+'">'+pill(e)+'</div>'
    +'<div class="dbody pad"><div class="dhead"><h2>'+esc(e.n)+'</h2><p>'+esc(e.m)+'</p></div>'
    +'<div class="tagcard">'+ICON.nfc+'<div><small>Puce NFC · NTAG 216</small><code>'+e.uid+'</code></div><div class="ref"><small>Réf.</small><code>'+e.ref+'</code></div><button class="cp" data-act="copy" aria-label="Copier la référence">'+ic('copy')+'</button></div>'
    +'<dl class="kv" style="margin:0">'
    +'<div><dt>'+ic('pin')+'Emplacement</dt><dd>'+esc(where(e))+'</dd></div>'
    +(p?'<div><dt>'+ic('heart')+'Prise en charge</dt><dd>'+esc(p.z.split(' · ')[1]||p.z)+'</dd></div><div><dt>'+ic('cal')+'En location depuis</dt><dd>'+fmt(e.since)+' ('+(-e.since)+' j)</dd></div>'+(e.end!==null?'<div><dt>'+ic('ret')+'Retour prévu</dt><dd>'+(e.end===0?'<span class="pill p-dispo">Aujourd\'hui</span>':rel(e.end))+'</dd></div>':''):'')
    +'<div><dt>'+ic('coins')+'Tarif de location</dt><dd class="num">'+xpf(e.px)+' / semaine</dd></div>'
    +'<div><dt>'+ic('tool')+'Prochain contrôle</dt>'+chk+'</div></dl>'
    +'<section>'+secH('hist','Historique','<span>'+e.h.length+' événements</span>')+'<ol class="tl">'+hist+'</ol></section></div></div>'
    +'<div class="actions pad">'+acts+'</div>';
}
function openDetail(id){S.cur=id;renderDetail();detail.classList.add('open');detail.setAttribute('aria-hidden','false');}
function closeDetail(){detail.classList.remove('open');detail.setAttribute('aria-hidden','true');S.cur=null;render(true);}

/* ---------- Feuilles ---------- */
function openSheet(html){sheet.innerHTML='<div class="grab"></div>'+html;sheet.classList.add('open');scrim.classList.add('open');}
function closeSheet(){timers.forEach(clearTimeout);timers=[];sheet.classList.remove('open');scrim.classList.remove('open');}
function startScan(){
  openSheet('<h2 id="scan-t">Prêt à scanner</h2><p class="sub" id="scan-s">Approchez le haut de l\'iPhone de la puce collée sur l\'équipement.</p>'
    +'<div class="radar" id="radar"><span></span><span></span><span></span><div class="core" id="core">'+ICON.nfc+'</div></div>'
    +'<button class="btn soft" data-act="close-sheet">Annuler</button>');
  timers.push(setTimeout(function(){
    var e=byId(scanOrder[scanIdx++%scanOrder.length]);
    $('radar').classList.add('found');$('core').innerHTML='<img src="'+src(e)+'" alt="">';
    $('scan-t').textContent='Puce reconnue';$('scan-s').textContent=e.n+' · '+e.ref;
    if(navigator.vibrate){try{navigator.vibrate(40);}catch(x){}}
    timers.push(setTimeout(function(){closeSheet();openDetail(e.id);},850));
  },1900));
}
function pickPatient(){
  openSheet('<h2>Attribuer à un bénéficiaire</h2><div class="plist">'+patients.map(function(p){
    return '<button class="pick" data-pick="'+p.id+'"><span class="avatar">'+initials(p.n)+'</span><span class="body"><div class="t">'+esc(p.n)+'</div><div class="s">'+esc(p.z)+'</div></span></button>';}).join('')
    +'</div><button class="btn soft" data-act="close-sheet">Annuler</button>');
}
var toastT;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show');},2200);}

/* ---------- Actions ---------- */
function act(a,e){
  if(a==='return'){var n=pat(e.pt).n;e.st='desinf';e.pt=null;e.end=null;e.since=0;e.h.push(ev(0,'Retour de location ('+n+'), en attente de désinfection'));toast('Retour enregistré');}
  else if(a==='clean'){e.st='dispo';e.since=0;e.h.push(ev(0,'Désinfection validée, remis en stock'));toast('Désinfection validée');}
  else if(a==='repair'){e.st='dispo';e.since=0;if(e.chk<0)e.chk=365;e.h.push(ev(0,'Maintenance clôturée, contrôle conforme'));toast('Matériel remis en stock');}
  else if(a==='fault'){e.st='maint';e.pt=null;e.end=null;e.since=0;e.h.push(ev(0,'Panne signalée, envoyé à l\'atelier'));toast('Panne signalée');}
  renderDetail();
}
document.addEventListener('click',function(x){
  var t=x.target.closest('[data-tab],[data-open],[data-act],[data-filter],[data-pick]');if(!t)return;
  var d=t.dataset;
  if(d.tab){S.tab=d.tab;render();}
  else if(d.open){openDetail(d.open);}
  else if(d.filter){S.filter=d.filter;S.tab='parc';render();}
  else if(d.pick){var e=byId(S.cur),p=pat(d.pick);e.st='loc';e.pt=p.id;e.since=0;e.end=28;e.h.push(ev(0,'Livré chez '+p.n));closeSheet();renderDetail();toast('Location démarrée');}
  else if(d.act==='scan')startScan();
  else if(d.act==='close-sheet')closeSheet();
  else if(d.act==='credits')openSheet('<h2>Crédits photos</h2><p class="sub">Photos issues de Wikimedia Commons, redimensionnées.</p><div class="plist">'+CREDITS.map(function(c){return '<div class="cred"><b>'+c[0]+'</b><span>'+c[1]+' · '+c[2]+'</span></div>';}).join('')+'</div><button class="btn soft" data-act="close-sheet">Fermer</button>');
  else if(d.act==='back')closeDetail();
  else if(d.act==='copy'){var r=byId(S.cur).ref;try{navigator.clipboard.writeText(r).then(function(){toast('Référence '+r+' copiée');},function(){toast('Référence : '+r);});}catch(z){toast('Référence : '+r);}}
  else if(d.act==='assign')pickPatient();
  else if(S.cur)act(d.act,byId(S.cur));
});
document.addEventListener('input',function(x){if(x.target.id==='q'){S.q=x.target.value;$('parc-list').innerHTML=parcRows();}});
document.addEventListener('keydown',function(x){if(x.key==='Escape'){if(sheet.classList.contains('open'))closeSheet();else if(S.cur)closeDetail();}});
render();
})();
</script>
