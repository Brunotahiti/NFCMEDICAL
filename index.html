<title>MédiParc NFC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : appli plein écran en une colonne (430 pt, iPhone 15 Pro Max) — en-tête, contenu défilant, barre d'onglets flottante avec bouton de scan central ; fiches et feuilles glissent par-dessus. */
:root{
  --bg:#EDF6F8; --bg-top:#C9EBF2; --hero2:#0E8F93; --deco:1; --map-sea:#CDEDF3; --map-reef:#A9E2EA; --map-land:#CFE7C6; --map-line:#8FBF8E; --glow:rgba(11,110,125,.30); --surface:#FFFFFF; --surface-2:#E2EAEC; --ink:#0D2730; --muted:#5B7078; --line:#D5DFE1;
  --accent:#0A7C88; --accent-ink:#FFFFFF; --accent-soft:#D8EEF2;
  --hero:#0B5361; --hero-fg:#F2FAFB; --hero-muted:#A9CBD2; --hero-track:#1D5360;
  --ok:#1A7F54; --ok-soft:#DCF2E6; --warn:#A65F00; --warn-soft:#FBEBD0;
  --crit:#B8352B; --crit-soft:#FADFDC; --info:#3154C4; --info-soft:#E0E7FB;
  --seg-loc:#7FA0FF; --seg-dispo:#5FD6A0; --seg-desinf:#F5BE6B; --seg-maint:#FF9288;
  --shadow:0 1px 2px rgba(13,39,48,.06),0 8px 24px rgba(13,39,48,.07);
  --scrim:rgba(6,22,28,.45);
  --f-display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-text:"Inter",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07181E; --bg-top:#0D2D38; --hero2:#1A6E78; --deco:.55; --map-sea:#0C2F3A; --map-reef:#15505C; --map-land:#1F4A3A; --map-line:#3C7A5E; --glow:rgba(0,0,0,.45); --surface:#0F252D; --surface-2:#17333C; --ink:#E8F1F2; --muted:#8FA6AD; --line:#21404A;
  --accent:#4CC3D9; --accent-ink:#04222A; --accent-soft:#123C47;
  --hero:#123E4A; --hero-fg:#F2FAFB; --hero-muted:#9DC3CB; --hero-track:#0A2A33;
  --ok:#5AD39A; --ok-soft:#10382A; --warn:#F2B45A; --warn-soft:#3B2B0E;
  --crit:#FF8A7E; --crit-soft:#42201C; --info:#93ABFF; --info-soft:#1B2955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.6);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#07181E; --bg-top:#0D2D38; --hero2:#1A6E78; --deco:.55; --map-sea:#0C2F3A; --map-reef:#15505C; --map-land:#1F4A3A; --map-line:#3C7A5E; --glow:rgba(0,0,0,.45); --surface:#0F252D; --surface-2:#17333C; --ink:#E8F1F2; --muted:#8FA6AD; --line:#21404A;
  --accent:#4CC3D9; --accent-ink:#04222A; --accent-soft:#123C47;
  --hero:#123E4A; --hero-fg:#F2FAFB; --hero-muted:#9DC3CB; --hero-track:#0A2A33;
  --ok:#5AD39A; --ok-soft:#10382A; --warn:#F2B45A; --warn-soft:#3B2B0E;
  --crit:#FF8A7E; --crit-soft:#42201C; --info:#93ABFF; --info-soft:#1B2955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bg-top) 0,var(--bg-top) 50%,var(--bg) 50%);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--bg-top),var(--bg) 300px)}
.deco{position:absolute;top:0;left:0;right:0;height:190px;pointer-events:none;opacity:var(--deco)}
.deco svg{width:100%;height:100%;display:block}
.top,main,.tabs{position:relative;z-index:1}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 14px}
.top .eyebrow{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.top .eyebrow svg{color:var(--accent);width:20px;height:20px}
.top.home h1::after{content:"";display:block;width:132px;height:6px;margin-top:3px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--hero2) 55%,transparent)}
.top .eyebrow.up{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.top h1{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.demo-tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);padding:9px 14px;border-radius:99px;white-space:nowrap;box-shadow:var(--shadow);margin-bottom:6px}
.demo-tag svg{color:var(--accent)}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 20px;display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;min-height:34px}
.sec-h h2{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.015em}
.sec-h h2 svg{color:var(--accent);width:24px;height:24px}
.sec-h>span{font-size:13px;color:var(--muted)}
.badge{flex:none;min-width:30px;height:30px;padding:0 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center}
.more{text-decoration:none;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:99px}

/* Carte parc */
.hero{background:radial-gradient(120% 90% at 85% 0%,var(--hero2),transparent 60%),linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);border-radius:28px;padding:20px 18px 22px;border:1.5px solid rgba(255,255,255,.3);display:flex;flex-direction:column;gap:16px;box-shadow:0 16px 32px -8px var(--glow)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-8px}
.hero .lbl{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--hero-fg);margin-bottom:6px}
.hero .lbl svg{width:24px;height:24px}
.hero .occ{display:flex;align-items:center;gap:9px;min-width:0}
.hero .trend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--hero-muted);margin-top:-8px}
.hero .trend span{display:inline-flex;align-items:center;gap:3px;background:var(--seg-dispo);color:#0B3B2A;font-weight:700;font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap}
.hero .trend svg{width:12px;height:12px;stroke-width:3}
.hero .big{white-space:nowrap;font-family:var(--f-display);font-size:58px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .big small{font-size:28px;font-weight:700;margin-left:4px}
.hero .side{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--hero-muted);border-left:1px solid rgba(255,255,255,.22);padding:6px 0 6px 12px;gap:8px}
.hero .side svg{width:24px;height:24px;color:var(--hero-fg)}
.hero .side b{display:block;font-family:var(--f-display);font-size:21px;color:var(--hero-fg);font-weight:700;white-space:nowrap}
.segbar{display:flex;gap:3px;height:16px}
.segbar button{border-radius:7px;min-width:6px;transition:flex-grow .5s ease}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.legend button{display:flex;align-items:center;gap:10px;padding:5px 8px;margin:-5px -8px;border-radius:10px;font-size:15px;color:var(--hero-fg)}
.legend button:active{background:rgba(255,255,255,.14)}
.sheet .list{overflow-y:auto;min-height:0;box-shadow:none;background:var(--bg)}
.sheet .list .row{min-height:68px}
.legend b{margin-left:auto;color:var(--hero-fg);font-weight:700;font-size:16px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}

/* Lignes */
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;min-height:72px}
.row:active,.mini:active,.pick:active{background:var(--surface-2)}
.row + .row{border-top:1px solid var(--line)}
.row .body{flex:1;min-width:0}
.row .t{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.row .s.si{display:flex;align-items:center;gap:6px;margin-top:2px}
.row .s.si{white-space:normal;align-items:flex-start}
.row .s.si svg{margin-top:1px}
.row .s.si span{min-width:0}
.row .pill+.chev{margin-left:-6px}
.row .pill{padding:6px 10px}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t.wrap{white-space:normal;font-weight:500;font-size:14px}
.row .chev{color:var(--muted);flex:none;opacity:.6}
.ico{width:52px;height:52px;border-radius:16px;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;flex:none}
.ico svg,.tab svg,.btn svg,.chev svg,.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.a-crit{background:var(--crit-soft);color:var(--crit)} .ico.a-warn{background:var(--warn-soft);color:var(--warn)}
.ico.a-info{background:var(--info-soft);color:var(--info)} .ico.a-ok{background:var(--ok-soft);color:var(--ok)}
.ph{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface-2);display:block}
.ph img,.pic img{width:100%;height:100%;object-fit:cover;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .pic{position:relative;display:block;aspect-ratio:4/3;background:var(--surface-2)}
.card .pic img{position:absolute;inset:0}
main>*{flex:none}
.card .pic .pill{position:absolute;left:8px;top:8px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.card .meta{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;min-width:0}
.card .t{font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ft{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px}
.card .dt{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt svg{color:var(--accent);width:15px;height:15px}
.card .pxc{flex:none;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:5px 8px;border-radius:9px;white-space:nowrap}
.card .px{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--accent);margin-top:2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:var(--gl);margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding:2px var(--gr) 14px var(--gl);margin-bottom:-14px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{flex:none;width:178px;scroll-snap-align:start}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:16px;padding:4px;gap:4px}
.seg button{display:flex;justify-content:center;align-items:center;gap:7px;padding:10px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] svg{color:var(--accent)}
.mapcard{display:block;width:100%;background:var(--map-sea);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.mapcard svg.map{display:block;width:100%;height:auto}
.mapfoot>div{min-width:0}
.mapfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);padding:12px 14px;text-align:left}
.mapfoot b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px}
.mapfoot span{font-size:13px;color:var(--muted)}
.mp-l{font:600 10.5px var(--f-text);fill:var(--ink);paint-order:stroke;stroke:var(--map-sea);stroke-width:3px;stroke-linejoin:round;text-anchor:middle}
.mp-c{font:700 12px var(--f-display);fill:var(--hero-fg);text-anchor:middle}
.mp-r{font:600 8.5px var(--f-text);letter-spacing:.14em;fill:var(--map-line);text-anchor:middle}
.mp-k{font:500 9px var(--f-text);fill:var(--muted)}
.map [data-place]{cursor:pointer}
.rent{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.rent .cols{display:grid;grid-template-columns:1fr 1fr}
.rent .cols>div+div{border-left:1px solid var(--line);padding-left:16px}
.rent small{display:block;font-size:12.5px;color:var(--muted)}
.rent b{display:block;font-family:var(--f-display);font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.rent .late b{color:var(--crit)}
.rent .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{display:block;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--hero),var(--hero2))}
.bar.over i{background:var(--crit)}
.mini .bar{height:4px;margin-top:5px}
.durs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.durs .chip{background:var(--bg)}
.credits{align-self:center;font-size:13px;color:var(--muted);text-decoration:underline;padding:8px}
.cred{font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.cred b{display:block;font-weight:600}.cred span{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;flex:none}
.p-loc{background:var(--info-soft);color:var(--info)} .p-dispo{background:var(--ok-soft);color:var(--ok)}
.p-desinf{background:var(--warn-soft);color:var(--warn)} .p-maint{background:var(--crit-soft);color:var(--crit)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* Recherche et filtres */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:20px;padding:0 6px 0 16px;box-shadow:var(--shadow);color:var(--accent);min-height:54px}
.sbtn{width:42px;height:42px;display:grid;place-items:center;color:var(--muted);border-radius:12px}
.sbtn svg{width:24px;height:24px}
.search>svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:12px 0;outline:none}
.chips{display:flex;gap:10px;overflow-x:auto;padding-block:4px 12px;margin-block:-4px -12px;scrollbar-width:none;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:10px 15px;border-radius:99px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip svg{color:var(--accent);width:18px;height:18px}
.chip[aria-pressed="true"]{background:linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg)}
.chip[aria-pressed="true"] svg{color:inherit}

/* Locations */
.pcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px 14px 14px 12px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--pc)}
.pcard header{display:flex;align-items:center;gap:10px}
.pcard .who{flex:1;min-width:0}
.pcard .who .t{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2}
.pcard .who .s{font-size:12.5px;color:var(--muted)}
.pcard .pill{font-size:11.5px;padding:4px 8px}
.avatar{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--pc,var(--accent)) 16%,var(--surface));color:var(--pc,var(--accent));display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.pcard .amt{flex:none;text-align:right;font-family:var(--f-display);font-weight:700;font-size:15px;border-left:1px solid var(--line);padding-left:10px;white-space:nowrap}
.pcard .amt small{display:block;font-family:var(--f-text);font-weight:400;font-size:12px;color:var(--muted)}
.mini .ph{width:58px;height:44px;border-radius:10px}
.mini{display:flex;align-items:center;gap:12px;width:100%;padding:7px 8px 7px 7px;border-radius:14px;background:var(--bg);font-size:14px}
.mini .chev{color:var(--ink);flex:none}
.mini .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mini .nm b{font-family:var(--f-display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .when{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.stat2{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.stat2>div{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 12px;min-width:0}
.stat2>div>svg{width:30px;height:30px;color:var(--accent)}
.stat2 .st-a{background:linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);box-shadow:0 14px 26px -10px var(--glow)}
.stat2 .st-a>svg,.stat2 .st-a span{color:var(--hero-fg)}
.banner{display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);border-radius:24px;padding:16px 6px;box-shadow:0 14px 26px -10px var(--glow)}
.banner>div{display:flex;align-items:center;gap:12px;padding:2px 14px}
.banner>div+div{border-left:1px solid rgba(255,255,255,.25)}
.banner svg{width:32px;height:32px}
.banner b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.banner span{font-size:13px}
.stat2 b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.stat2 span{font-size:12.5px;color:var(--muted)}

/* Barre d'onglets */
.tabs{flex:none;margin:0 var(--gr) 8px var(--gl);background:var(--surface);border-radius:32px;box-shadow:0 10px 30px -6px var(--glow),var(--shadow);display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:center;padding:7px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;font-size:12px;font-weight:600;color:var(--muted);border-radius:24px;transition:background .2s,color .2s}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

function xpf(n){return n.toLocaleString('fr-FR').replace(/\s/g,'\u202f')+'\u00a0XPF';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function byId(id){for(var i=0;i<equip.length;i++)if(equip[i].id===id)return equip[i];}
function pat(id){for(var i=0;i<patients.length;i++)if(patients[i].id===id)return patients[i];}
function dateOf(d){var t=new Date();t.setHours(12,0,0,0);t.setDate(t.getDate()+d);return t;}
function fmt(d){return dateOf(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function rel(d){if(d===0)return 'Aujourd\'hui';if(d===-1)return 'Hier';if(d===1)return 'Demain';return fmt(d);}
function initials(n){return n.split(' ').filter(function(w){return /^[A-ZÉ]/.test(w);}).slice(0,2).map(function(w){return w[0];}).join('');}
function jours(n){return n+' jour'+(n>1?'s':'');}
function sem(n){var w=Math.floor(n/7),d=n%7;return n<14?jours(n):w+' sem.'+(d?' '+d+' j':'');}
/* Durée de location : écoulée, prévue, restante (négative = retard). */
function rent(e){var el=-e.since,tot=e.end-e.since;return {el:el,tot:tot,left:e.end,pct:Math.max(3,Math.min(100,Math.round(el/Math.max(tot,1)*100)))};}
function leftTxt(r){return r.left<0?'retard de '+jours(-r.left):r.left===0?'retour aujourd\'hui':'reste '+sem(r.left);}
function rentCard(e){
  var r=rent(e),late=r.left<0;
  return '<div class="rent"><div class="cols"><div><small>Loué depuis</small><b class="num">'+(r.el===0?'Aujourd\'hui':sem(r.el))+'</b><small>début le '+fmt(e.since)+'</small></div>'
    +'<div class="'+(late?'late':'')+'"><small>'+(late?'En retard de':r.left===0?'Retour prévu':'Encore')+'</small><b class="num">'+(late?sem(-r.left):r.left===0?'Aujourd\'hui':sem(r.left))+'</b><small>retour le '+fmt(e.end)+'</small></div></div>'
    +'<div class="bar'+(late?' over':'')+'" role="img" aria-label="'+r.pct+' % de la durée prévue écoulée"><i style="width:'+r.pct+'%"></i></div>'
    +'<div class="foot"><span>Durée prévue : '+jours(r.tot)+(r.tot>=14?' ('+sem(r.tot)+')':'')+'</span><button class="more" data-act="extend">+ 1 semaine</button></div></div>';
}
function count(st){return equip.filter(function(e){return e.st===st;}).length;}
function pill(e){return '<span class="pill '+STATUS[e.st].c+'">'+ic(PIC[e.st])+STATUS[e.st].l+'</span>';}
function where(e){
  if(e.st==='loc')return pat(e.pt).n;

/* ---------- Plan de Tahiti (contour simplifié, projection plate : 6,1 px par km) ---------- */
var COAST=[[-17.545,-149.615],[-17.53,-149.57],[-17.515,-149.52],[-17.495,-149.495],[-17.51,-149.42],[-17.535,-149.35],[-17.57,-149.31],[-17.61,-149.295],[-17.68,-149.3],[-17.725,-149.295],[-17.735,-149.225],[-17.745,-149.155],[-17.79,-149.12],[-17.855,-149.15],[-17.85,-149.26],[-17.8,-149.29],[-17.765,-149.31],[-17.75,-149.325],[-17.76,-149.36],[-17.775,-149.42],[-17.765,-149.5],[-17.74,-149.57],[-17.69,-149.595],[-17.63,-149.615],[-17.575,-149.62]];
function mx(lon){return (lon+149.7)*645;}
function my(lat){return (-17.47-lat)*677;}
var COAST_D=(function(){
  var p=COAST.map(function(c){return [mx(c[1]),my(c[0])];}),n=p.length,f=function(v){return v.toFixed(1);},d='M'+f(p[0][0])+' '+f(p[0][1]);
  for(var i=0;i<n;i++){var a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];
    d+='C'+f(b[0]+(c[0]-a[0])/6)+' '+f(b[1]+(c[1]-a[1])/6)+' '+f(c[0]-(e[0]-b[0])/6)+' '+f(c[1]-(e[1]-b[1])/6)+' '+f(c[0])+' '+f(c[1]);}
  return d+'Z';})();
function place(id){return id==='depot'?DEPOT:pat(id);}
function placeOf(e){return e.st==='loc'?e.pt:'depot';}
function atPlace(id){return equip.filter(function(e){return placeOf(e)===id;});}
/* pins : [{id, n (nombre ou null)}], sel : lieu mis en avant, tap : épingles cliquables */
function mapSvg(pins,sel,tap){
  var h='<svg class="map" viewBox="0 0 400 292" role="img" aria-label="Plan de Tahiti avec l\'emplacement du matériel">'
    +'<path d="'+COAST_D+'" fill="none" stroke="var(--map-reef)" stroke-width="16" stroke-linejoin="round"/>'
    +'<path d="'+COAST_D+'" fill="var(--map-land)" stroke="var(--map-line)" stroke-width="1.2"/>'
    +'<text class="mp-r" x="'+mx(-149.45)+'" y="'+my(-17.635)+'">TAHITI NUI</text><text class="mp-r" x="'+mx(-149.21)+'" y="'+my(-17.8)+'">TAHITI ITI</text>'
    +'<path d="M16 276h61" stroke="var(--muted)" stroke-width="1.5"/><path d="M16 272v8M77 272v8" stroke="var(--muted)" stroke-width="1.5"/><text class="mp-k" x="84" y="279">10 km</text>';
  pins.slice().sort(function(a,b){return (a.id===sel)-(b.id===sel);}).forEach(function(pn){
    var pl=place(pn.id),x=mx(pl.lon).toFixed(1),y=my(pl.lat).toFixed(1),on=pn.id===sel,r=on?15:12;
    h+='<g transform="translate('+x+' '+y+')"'+(tap?' data-place="'+pn.id+'"':'')+'>'
      +(on?'<circle r="21" fill="var(--accent)" opacity=".22"/>':'')
      +(pn.id==='depot'?'<rect x="'+(-r)+'" y="'+(-r)+'" width="'+2*r+'" height="'+2*r+'" rx="6" fill="var(--hero)" stroke="var(--surface)" stroke-width="2.5"/>':'<circle r="'+r+'" fill="var(--hero2)" stroke="var(--surface)" stroke-width="2.5"/>')
      +(pn.n===null?'<circle r="4" fill="var(--hero-fg)"/>':'<text class="mp-c" y="4.3">'+pn.n+'</text>')
      +'<text class="mp-l" y="'+(r+13)+'">'+esc(pl.c)+'</text></g>';
  });
  return h+'</svg>';
}

    return card(e,null,'<span class="ft"><span class="dt">'+ic('cal')+(e.st==='loc'?(function(r){return r.left<0?'Retard '+(-r.left)+' j':r.left===0?'Retour auj.':'Reste '+r.left+' j';})(rent(e)):(e.since===0?'Aujourd\'hui':fmt(e.since)))+'</span><span class="pxc num">'+xpf(e.px)+'</span></span>');

/* ---------- Puces NFC : chaque puce porte un lien (enregistrement NDEF de type URI) ---------- */
var LKEY='mediparc-liens',BKEY='mediparc-base',DEFBASE='https://claude.ai/artifact/GzLtKdSYdmEHSFtsnMWLQ2#';
var base=DEFBASE,settingsEl=$('settings'),setOpen=false,tagId=null,pendingLink=null,linkTarget=null;
try{base=localStorage.getItem(BKEY)||DEFBASE;}catch(x){}
function defLink(e){return base+e.ref;}
equip.forEach(function(e){e.link=defLink(e);});
try{var saved=JSON.parse(localStorage.getItem(LKEY)||'{}');equip.forEach(function(e){if(e.id in saved)e.link=saved[e.id];});}catch(x){}
function saveLinks(){try{var m={};equip.forEach(function(e){m[e.id]=e.link;});localStorage.setItem(LKEY,JSON.stringify(m));localStorage.setItem(BKEY,base);}catch(x){}}
function shortLink(u){return u.replace(/^https?:\/\//,'');}
/* Affichage compact : on garde le début et la fin, là où se trouve la référence. */
function midLink(u){u=shortLink(u);return u.length>36?u.slice(0,17)+'…'+u.slice(-17):u;}
function normUrl(v){
  v=String(v).trim();if(!v||/\s/.test(v))return null;
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(v))v='https://'+v;
  try{var u=new URL(v);return /^https?:$/.test(u.protocol)&&u.hostname.indexOf('.')>0?v:null;}catch(x){return null;}
}
function sameLink(a,b){var k=function(u){return String(u).trim().replace(/\/+$/,'').toLowerCase();};return k(a)===k(b);}
/* Retrouve l'équipement d'un lien : lien identique, sinon lien qui se termine par la référence (…/LIT-0142, …#LIT-0142). */
function findByLink(u){
  var e=equip.filter(function(x){return x.link&&sameLink(x.link,u);})[0];
  if(e)return e;
  var m=String(u).trim().match(/[#\/=]([A-Za-z]{3}-\d{4})\/?$/);
  return m?equip.filter(function(x){return x.link&&x.ref===m[1].toUpperCase();})[0]:null;
}
function nativeNfc(){return window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.nfc;}
function radarSheet(t,sub){
  openSheet('<h2 id="scan-t">'+t+'</h2><p class="sub" id="scan-s">'+sub+'</p>'
    +'<div class="radar" id="radar"><span></span><span></span><span></span><div class="core" id="core">'+ICON.nfc+'</div></div>'
    +'<button class="btn soft" data-act="close-sheet">Annuler</button>');
}
/* Dans l'app iOS, lecture et écriture passent par Core NFC ; ailleurs (navigateur, simulateur) elles sont simulées. */
function startScan(){linkTarget=null;var n=nativeNfc();if(n){n.postMessage({action:'read'});}else simScan();}
function simScan(){
  radarSheet('Prêt à scanner','Approchez le haut de l\'iPhone de la puce collée sur l\'équipement.');
  timers.push(setTimeout(function(){
    var withTag=equip.filter(function(x){return x.link;});
    if(!withTag.length){closeSheet();toast('Aucun équipement n\'a encore de puce');return;}
    var e=byId(scanOrder[scanIdx++%scanOrder.length]);if(!e.link)e=withTag[0];
    $('radar').classList.add('found');$('core').innerHTML='<img src="'+src(e)+'" alt="">';
    $('scan-t').textContent='Puce reconnue';$('scan-s').textContent=e.n+' · '+e.ref;
    timers.push(setTimeout(function(){closeSheet();openDetail(e.id);},850));
  },1900));
}
function assignLink(e,u){
  equip.forEach(function(o){if(o!==e&&o.link&&sameLink(o.link,u)){o.link='';o.h.push(ev(0,'Puce NFC réattribuée à '+e.ref));}});
  e.link=u;e.h.push(ev(0,'Puce NFC associée'));saveLinks();closeSheet();if(setOpen)renderSettings();else openDetail(e.id);toast('Puce associée à '+e.ref);
}
/* Lire le lien déjà présent sur une puce et l'associer à l'équipement. */
function readTagFor(id){
  linkTarget=id;var n=nativeNfc();if(n){n.postMessage({action:'read'});return;}
  var e=byId(id);radarSheet('Lire une puce','Approchez la puce à associer à : '+esc(e.n)+'.');
  timers.push(setTimeout(function(){linkTarget=null;$('radar').classList.add('found');$('core').innerHTML=ICON.check;$('scan-t').textContent='Lien lu';$('scan-s').textContent=shortLink(defLink(e));
    timers.push(setTimeout(function(){assignLink(e,defLink(e));},850));},1900));
}
/* Écrire le lien de l'équipement sur une puce. */
function writeTagFor(id){
  var e=byId(id),u=e.link||defLink(e),n=nativeNfc();linkTarget=id;
  if(n){n.postMessage({action:'write',url:u});return;}
  radarSheet('Écrire la puce','Approchez la puce à coller sur : '+esc(e.n)+'.');
  timers.push(setTimeout(function(){linkTarget=null;$('radar').classList.add('found');$('core').innerHTML=ICON.check;$('scan-t').textContent='Lien écrit';$('scan-s').textContent=shortLink(u);
    timers.push(setTimeout(function(){assignLink(e,u);},850));},1900));
}
window.onNfcUnavailable=function(){var t=linkTarget;linkTarget=null;if(t)toast('NFC indisponible sur cet appareil');else simScan();};

window.onNfcError=function(msg){linkTarget=null;toast(msg||'Lecture impossible');};
window.onNfcWritten=function(u){var e=byId(linkTarget);linkTarget=null;if(e)assignLink(e,u);};
window.onNfcLink=function(u){

  if(t){
    if(u){assignLink(t,u);return;}
    tagId=t.id;
    openSheet('<h2>Puce vierge</h2><p class="sub">Cette puce ne contient pas encore de lien. Écrire celui de '+esc(t.n)+' ?</p><button class="btn" data-act="write-tag">'+ICON.nfc+'Écrire le lien sur la puce</button><button class="btn soft" data-act="close-sheet">Annuler</button>');

  }
  if(!u){toast('Cette puce ne contient pas de lien');return;}
  var e=findByLink(u);
  if(e){closeSheet();openDetail(e.id);toast('Puce reconnue · '+e.ref);return;}
  pendingLink=u;
  openSheet('<h2>Lien inconnu</h2><p class="sub"><code>'+esc(shortLink(u))+'</code><br>Choisissez l\'équipement auquel associer cette puce.</p><div class="plist">'+equip.map(function(x){
    return '<button class="pick" data-link="'+x.id+'">'+ph(x)+'<span class="body"><div class="t">'+esc(x.n)+'</div><div class="s">'+x.ref+'</div></span></button>';}).join('')
    +'</div><button class="btn soft" data-act="close-sheet">Annuler</button>');
};

  else if(d.act==='scan')startScan();
  else if(d.act==='close-sheet')closeSheet();
  else if(d.act==='credits')openSheet('<h2>Crédits photos</h2><p class="sub">Photos issues de Wikimedia Commons, redimensionnées.</p><div class="plist">'+CREDITS.map(function(c){return '<div class="cred"><b>'+c[0]+'</b><span>'+c[1]+' · '+c[2]+'</span></div>';}).join('')+'</div><button class="btn soft" data-act="close-sheet">Fermer</button>');
  else if(d.act==='back')closeDetail();
  else if(d.act==='copy'){var cl=byId(S.cur).link;if(cl)copyText(cl,'Lien copié');else toast('Aucune puce associée');}
  else if(d.act==='assign')pickPatient();
  else if(d.act==='program')writeTagFor(S.cur);
  else if(S.cur)act(d.act,byId(S.cur));
});
document.addEventListener('input',function(x){if(x.target.id==='q'){S.q=x.target.value;$('parc-list').innerHTML=parcRows();}});
document.addEventListener('keydown',function(x){if(x.key==='Enter'&&x.target.id==='uid-in'){saveUid();return;}if(x.key==='Enter'&&x.target.id==='base-in'){saveBase();return;}if(x.key==='Escape'){if(sheet.classList.contains('open'))closeSheet();else if(S.cur)closeDetail();else if(setOpen)closeSettings();}});
render();
openFromHash();
})();
</script>
