<title>MédiParc NFC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : appli plein écran en une colonne (430 pt, iPhone 15 Pro Max) — en-tête, contenu défilant, barre d'onglets flottante avec bouton de scan central ; fiches et feuilles glissent par-dessus. */
:root{
  --bg:#EDF6F8; --bg-top:#C9EBF2; --hero2:#0E8F93; --deco:1; --brand:#62CFC4; --tabbar:#0A3F4B; --tab-fg:#A9CBD2; --map-sea:#CDEDF3; --map-reef:#A9E2EA; --map-land:#CFE7C6; --map-line:#8FBF8E; --glow:rgba(11,110,125,.30); --surface:#FFFFFF; --surface-2:#E2EAEC; --ink:#0D2730; --muted:#5B7078; --line:#D5DFE1;
  --accent:#0A7C88; --accent-ink:#FFFFFF; --accent-soft:#D8EEF2;
  --hero:#0B5361; --hero-fg:#F2FAFB; --hero-muted:#A9CBD2; --hero-track:#1D5360;
  --ok:#1A7F54; --ok-soft:#DCF2E6; --warn:#A65F00; --warn-soft:#FBEBD0;
  --crit:#B8352B; --crit-soft:#FADFDC; --info:#3154C4; --info-soft:#E0E7FB;
  --seg-loc:#7FA0FF; --seg-dispo:#5FD6A0; --seg-desinf:#F5BE6B; --seg-maint:#FF9288;
  --shadow:0 1px 2px rgba(13,39,48,.06),0 8px 24px rgba(13,39,48,.07);
  --scrim:rgba(6,22,28,.45);
  --f-display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-text:"Inter",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07181E; --bg-top:#0D2D38; --hero2:#1A6E78; --deco:.75; --brand:#62CFC4; --tabbar:#0A2A33; --tab-fg:#8FB3BB; --map-sea:#0C2F3A; --map-reef:#15505C; --map-land:#1F4A3A; --map-line:#3C7A5E; --glow:rgba(0,0,0,.45); --surface:#0F252D; --surface-2:#17333C; --ink:#E8F1F2; --muted:#8FA6AD; --line:#21404A;
  --accent:#4CC3D9; --accent-ink:#04222A; --accent-soft:#123C47;
  --hero:#123E4A; --hero-fg:#F2FAFB; --hero-muted:#9DC3CB; --hero-track:#0A2A33;
  --ok:#5AD39A; --ok-soft:#10382A; --warn:#F2B45A; --warn-soft:#3B2B0E;
  --crit:#FF8A7E; --crit-soft:#42201C; --info:#93ABFF; --info-soft:#1B2955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.6);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#07181E; --bg-top:#0D2D38; --hero2:#1A6E78; --deco:.75; --brand:#62CFC4; --tabbar:#0A2A33; --tab-fg:#8FB3BB; --map-sea:#0C2F3A; --map-reef:#15505C; --map-land:#1F4A3A; --map-line:#3C7A5E; --glow:rgba(0,0,0,.45); --surface:#0F252D; --surface-2:#17333C; --ink:#E8F1F2; --muted:#8FA6AD; --line:#21404A;
  --accent:#4CC3D9; --accent-ink:#04222A; --accent-soft:#123C47;
  --hero:#123E4A; --hero-fg:#F2FAFB; --hero-muted:#9DC3CB; --hero-track:#0A2A33;
  --ok:#5AD39A; --ok-soft:#10382A; --warn:#F2B45A; --warn-soft:#3B2B0E;
  --crit:#FF8A7E; --crit-soft:#42201C; --info:#93ABFF; --info-soft:#1B2955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--hero) 0,var(--hero) 50%,var(--tabbar) 50%);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--bg-top),var(--bg) 360px)}
.deco{position:absolute;top:0;left:0;right:0;height:190px;pointer-events:none;opacity:var(--deco);z-index:1}
.deco svg{width:100%;height:100%;display:block}
.top,main,.tabs{position:relative;z-index:2}
.appbar{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:8px;padding-block:8px 16px;color:var(--hero-fg);background:linear-gradient(120deg,var(--hero),var(--hero2));border-radius:0 0 50% 50%/0 0 16px 16px}
.appbar .logo{width:44px;height:32px;flex:none;color:var(--hero-fg)}
.appbar .brand{flex:1;min-width:0;line-height:1.15}
.appbar .brand b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.015em;color:var(--brand)}
.appbar .brand b span{color:var(--hero-fg)}
.appbar .brand small{font-size:12.5px;color:var(--hero-fg);opacity:.85}
.abtn{position:relative;z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(6,40,48,.45);color:var(--hero-fg)}
.abtn svg{width:21px;height:21px}
.ndot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--crit);color:#fff;font:700 10.5px/18px var(--f-text);font-style:normal;text-align:center;border:0}
.subt{font-size:14px;color:var(--muted);margin-top:2px}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 14px}
.top .eyebrow{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.top .eyebrow svg{color:var(--accent);width:20px;height:20px}

.top .eyebrow.up{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.top h1{font-family:var(--f-display);font-size:31px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.demo-tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);padding:9px 14px;border-radius:99px;white-space:nowrap;box-shadow:var(--shadow);margin-bottom:6px}
.demo-tag svg{color:var(--accent)}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 20px;display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;min-height:34px}
.sec-h h2{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.015em}
.sec-h h2 svg{color:var(--accent);width:24px;height:24px}
.sec-h>span{font-size:13px;color:var(--muted)}
.badge{flex:none;min-width:30px;height:30px;padding:0 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center}
.more{text-decoration:none;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:99px}

/* Carte parc */
.hero{background:radial-gradient(120% 90% at 85% 0%,var(--hero2),transparent 60%),linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);border-radius:28px;padding:20px 18px 22px;border:1.5px solid rgba(255,255,255,.3);display:flex;flex-direction:column;gap:16px;box-shadow:0 16px 32px -8px var(--glow)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-8px}
.hero .lbl{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--hero-fg);margin-bottom:6px}
.hero .lbl svg{width:24px;height:24px}
.hero .occ{display:flex;align-items:center;gap:9px;min-width:0}
.hero .trend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--hero-muted);margin-top:-8px}
.hero .trend span{display:inline-flex;align-items:center;gap:3px;background:var(--seg-dispo);color:#0B3B2A;font-weight:700;font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap}
.hero .trend svg{width:12px;height:12px;stroke-width:3}
.hero .big{white-space:nowrap;font-family:var(--f-display);font-size:58px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .big small{font-size:28px;font-weight:700;margin-left:4px}
.hero .side{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--hero-muted);border-left:1px solid rgba(255,255,255,.22);padding:6px 0 6px 12px;gap:8px}
.hero .side svg{width:24px;height:24px;color:var(--hero-fg)}
.hero .side b{display:block;font-family:var(--f-display);font-size:21px;color:var(--hero-fg);font-weight:700;white-space:nowrap}
.segbar{display:flex;gap:3px;height:16px}
.segbar button{border-radius:7px;min-width:6px;transition:flex-grow .5s ease}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px;margin-top:-2px}
.legend button{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--hero-fg);padding:4px 6px;margin:0 -6px;border-radius:8px;min-width:0}
.legend button:active{background:rgba(255,255,255,.14)}
.sheet .list{overflow-y:auto;min-height:0;box-shadow:none;background:var(--bg)}
.sheet .list .row{min-height:68px}
.legend button:active{background:rgba(255,255,255,.14)}
.legend b{color:var(--hero-fg);font-weight:700;font-size:15px;margin-left:auto}
.legend .dot{width:9px;height:9px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}

/* Lignes */
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;min-height:72px}
.row:active,.mini:active,.pick:active{background:var(--surface-2)}
.row + .row{border-top:1px solid var(--line)}
.row .body{flex:1;min-width:0}
.row .t{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.row .s.si{display:flex;align-items:center;gap:6px;margin-top:2px}
.row .s.si{white-space:normal;align-items:flex-start}
.row .s.si svg{margin-top:1px}
.row .s.si span{min-width:0}
.row .pill+.chev{margin-left:-6px}
.row .pill{padding:6px 10px}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t.wrap{white-space:normal;font-weight:500;font-size:14px}
.row .chev{color:var(--muted);flex:none;opacity:.6}
.ico{width:52px;height:52px;border-radius:16px;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;flex:none}
.ico svg,.tab svg,.btn svg,.chev svg,.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.a-crit{background:var(--crit-soft);color:var(--crit)} .ico.a-warn{background:var(--warn-soft);color:var(--warn)}
.ico.a-info{background:var(--info-soft);color:var(--info)} .ico.a-ok{background:var(--ok-soft);color:var(--ok)}
.ph{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface-2);display:block}
.noimg{display:grid;place-items:center;width:100%;height:100%;color:var(--accent);background:var(--accent-soft)}
.noimg svg{width:44%;height:44%;max-width:84px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card .pic .noimg{position:absolute;inset:0}
.dhero .noimg{position:relative}
.ph img,.pic img{width:100%;height:100%;object-fit:cover;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .pic{position:relative;display:block;aspect-ratio:4/3;background:var(--surface-2)}
.card .pic img{position:absolute;inset:0}
main>*{flex:none}
.card .pic .pill{position:absolute;left:8px;top:8px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.card .meta{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;min-width:0}
.card .t{font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ft{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-top:8px}
.card .dt{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt svg{color:var(--accent);width:15px;height:15px}
.card .pxc{flex:none;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:5px 8px;border-radius:9px;white-space:nowrap}
.card .px{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--accent);margin-top:2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:var(--gl);margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding:2px var(--gr) 14px var(--gl);margin-bottom:-14px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{flex:none;width:178px;scroll-snap-align:start}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:16px;padding:4px;gap:4px}
.seg button{display:flex;justify-content:center;align-items:center;gap:7px;padding:10px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] svg{color:var(--accent)}
.mapcard{display:block;width:100%;background:var(--map-sea);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.mapcard svg.map{display:block;width:100%;height:auto}
.mapfoot>div{min-width:0}
.mapfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);padding:12px 14px;text-align:left}
.mapfoot b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px}
.mapfoot span{font-size:13px;color:var(--muted)}
.mp-l{font:600 10.5px var(--f-text);fill:var(--ink);paint-order:stroke;stroke:var(--map-sea);stroke-width:3px;stroke-linejoin:round;text-anchor:middle}
.mp-c{font:700 12px var(--f-display);fill:var(--hero-fg);text-anchor:middle}
.mp-r{font:600 8.5px var(--f-text);letter-spacing:.14em;fill:var(--map-line);text-anchor:middle}
.mp-k{font:500 9px var(--f-text);fill:var(--muted)}
.map [data-place]{cursor:pointer}
.rent{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.rent .cols{display:grid;grid-template-columns:1fr 1fr}
.rent .cols>div+div{border-left:1px solid var(--line);padding-left:16px}
.rent small{display:block;font-size:12.5px;color:var(--muted)}
.rent b{display:block;font-family:var(--f-display);font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.rent .late b{color:var(--crit)}
.rent .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{display:block;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--hero),var(--hero2))}
.bar.over i{background:var(--crit)}
.bar.done i{background:var(--ok)}
.pct{flex:none;font-family:var(--f-display);font-size:17px;font-weight:700;color:var(--accent)}
.pct.ok{color:var(--ok)}
.rent b.pct{display:inline;font-size:20px}
.rent .cols b{font-size:20px}
.prow .bar{height:6px;margin:5px 0 3px}
.more-d summary{list-style:none;cursor:pointer;align-self:center;text-align:center;font-size:14px;font-weight:600;color:var(--accent);padding:10px}
.more-d summary::-webkit-details-marker{display:none}
.more-d summary::after{content:" ▾"}
.more-d[open] summary::after{content:" ▴"}
.mini .bar{height:4px;margin-top:5px}
.durs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.durs .chip{background:var(--bg)}
.seg.four{display:flex;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:5px;gap:2px}
.seg.four button{flex:1 1 auto;padding:10px 6px;gap:5px;font-size:12.5px;border-radius:13px;color:var(--ink);white-space:nowrap}
.seg.four button svg{width:16px;height:16px;color:var(--accent)}
.seg.four button[aria-pressed="true"]{background:linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);box-shadow:0 6px 14px -6px var(--glow)}
.seg.four button[aria-pressed="true"] svg{color:inherit}
.sts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.st{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:9px 3px 9px 6px;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden;gap:1px;min-width:0;text-align:left}
.st .ci{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin-bottom:4px;background:var(--accent-soft);color:var(--accent)}
.st .ci svg{width:17px;height:17px}
.st b{font-family:var(--f-display);font-size:23px;font-weight:700;line-height:1.05}
.st span{font-size:9.8px;color:var(--ink);white-space:nowrap}
.st em{font-style:normal;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;margin-top:4px}
.st[aria-pressed="true"]{outline:2px solid var(--accent)}
.c-loc{background:var(--info-soft)!important;color:var(--info)!important}.c-dispo{background:var(--ok-soft)!important;color:var(--ok)!important}
.c-desinf{background:var(--warn-soft)!important;color:var(--warn)!important}.c-maint{background:var(--crit-soft)!important;color:var(--crit)!important}
.card{position:relative;cursor:pointer}
.fav{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.2);opacity:.92}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{color:var(--crit)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.card .meta{position:relative}
.keb{position:absolute;right:0;top:6px;width:30px;height:34px;display:grid;place-items:center;color:var(--ink)}
.keb svg{width:20px;height:20px;fill:currentColor;stroke:none}
.card.wk .t{padding-right:20px}
.chip em{font-style:normal;font-size:12px;font-weight:700;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink);text-align:center}
.chip[aria-pressed="true"] em{background:var(--hero-fg);color:var(--hero)}
.stat2 .tr{display:flex;align-items:center;gap:6px;font-size:10.5px!important;margin-top:5px;white-space:nowrap}
.stat2 .tr i{font-style:normal;display:inline-flex;align-items:center;gap:2px;background:var(--seg-dispo);color:#0B3B2A;font-weight:700;font-size:11px;padding:2px 7px;border-radius:99px}
.stat2 .tr svg{width:10px;height:10px;stroke-width:3}
.row .s.w2{white-space:normal}
.kv dd .dsub{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.mini .when.fa{color:var(--accent);font-weight:600}
.mini .when.fa svg{width:13px;height:13px}
.tools{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.tbtn.on{background:var(--hero);color:var(--hero-fg)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:18px;font-family:var(--f-display);font-weight:600;font-size:16px;background:linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);box-shadow:0 10px 20px -8px var(--glow)}
.btn.soft{box-shadow:none;font-family:var(--f-text)}
.btn.danger{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit);box-shadow:none}
#settings{z-index:19}
.sbar{display:flex;align-items:center;gap:14px;padding-block:12px}
.sbar .back{position:static}
.sbar h2{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em}
.sbody{display:flex;flex-direction:column;gap:20px;padding-block:6px 24px}
.note{font-size:14px;color:var(--muted);line-height:1.45}
.row .s code,.sheet .sub code{font-family:var(--f-mono);font-size:11.5px}
.fld{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:-8px}
.uidrow{display:flex;gap:8px}
.uidrow .btn{width:auto;flex:none;padding:0 16px;min-height:52px}
input.uid{flex:1;min-width:0;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--f-mono);font-size:16px;padding:0 12px}
input.uid::placeholder{color:var(--muted);opacity:.6}
.err{font-size:13px;color:var(--crit);margin-top:-6px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn.prog{min-height:48px;margin-top:-8px;background:var(--surface);color:var(--accent);box-shadow:var(--shadow);font-size:15px}
.actions .btn.danger{flex:none;width:auto;box-shadow:none;background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit);font-size:13px;padding:0 10px}
.btn.danger svg{width:20px;height:20px}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn:active{opacity:.85}

/* Feuilles */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:30}
.scrim.open{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding-block:10px 20px;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);z-index:31;display:flex;flex-direction:column;gap:14px;max-height:86%;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.02em;text-align:center}
.sheet p.sub{text-align:center;color:var(--muted);font-size:14px;max-width:30ch;align-self:center}
.radar{position:relative;width:190px;height:190px;align-self:center;display:grid;place-items:center;margin:6px 0}
.radar span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ping 2.1s ease-out infinite}
.radar span:nth-child(2){animation-delay:.7s}.radar span:nth-child(3){animation-delay:1.4s}
.radar .core{box-sizing:border-box;width:92px;height:92px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:background .25s,transform .25s}
.radar .core svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.radar.found span{animation:none}
.radar.found .core{background:var(--ok);color:var(--surface);transform:scale(1.35);padding:4px;overflow:hidden}
.radar .core img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
@keyframes ping{0%{transform:scale(.48);opacity:.75}100%{transform:scale(1);opacity:0}}
.sheet .plist{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;background:var(--bg)}
.pick .body{flex:1;min-width:0}.pick .t{font-weight:600}.pick .s{font-size:13px;color:var(--muted)}

.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:40;transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function shortLink(u){return u.replace(/^https?:\/\//,'');}
/* Affichage compact : on garde le début et la fin, là où se trouve la référence. */
function midLink(u){u=shortLink(u);return u.length>36?u.slice(0,17)+'…'+u.slice(-17):u;}
function normUrl(v){
  v=String(v).trim();if(!v||/\s/.test(v))return null;
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(v))v='https://'+v;
  try{var u=new URL(v);return /^https?:$/.test(u.protocol)&&u.hostname.indexOf('.')>0?v:null;}catch(x){return null;}
}
function sameLink(a,b){var k=function(u){return String(u).trim().replace(/\/+$/,'').toLowerCase();};return k(a)===k(b);}
/* Retrouve l'équipement d'un lien : lien identique, sinon lien qui se termine par la référence (…/LIT-0142, …#LIT-0142). */
function findByLink(u){
  var e=equip.filter(function(x){return x.link&&sameLink(x.link,u);})[0];
  if(e)return e;
  var m=String(u).trim().match(/[#\/=]([A-Za-z]{3}-\d{4})\/?$/);
  return m?equip.filter(function(x){return x.link&&x.ref===m[1].toUpperCase();})[0]:null;

var ONLINE=/^https?:$/.test(location.protocol)&&/^\/materiel(\/|$)/.test(location.pathname);
var API='/materiel/api/',ME=null,ROLE='admin',STAFF=true,COMMUNES=[],booted=false,ovMode='settings';
function srv(method,p,body){
  return fetch(API+p,{method:method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})
    .then(handleResp);
}
function handleResp(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.error||'Erreur '+r.status);e.status=r.status;throw e;}return j;});}
function errToast(err){if(err&&err.status===401){showLogin();return;}if(err&&err.status===403&&/mot de passe provisoire/.test(err.message)){showPwd(true);return;}toast(err&&err.message?err.message:'Connexion au serveur impossible');}
function off(s){if(!s)return null;var t=new Date();t.setHours(12,0,0,0);return Math.round((new Date(s.slice(0,10)+'T12:00:00')-t)/864e5);}
function setRole(me){ME=me;ROLE=me.role;STAFF=ROLE!=='pharmacie';}
function loadState(){return srv('GET','state').then(applyState);}
function applyState(st){
  setRole(st.me);DOCS_ON=!!st.documents_enabled;base=st.link_base||DEFBASE;COMMUNES=st.communes||[];
  PHARM=st.pharmacies.map(function(f){return {id:String(f.id),n:f.name,c:f.commune};});
  patients=st.patients.map(function(p){return {id:String(p.id),a:p.address||p.commune,c:p.commune,lat:p.lat,lon:p.lon,n:p.name,z:p.commune,ph:p.phone||''};});
  var favs={};try{JSON.parse(localStorage.getItem(FKEY)||'[]').forEach(function(id){favs[id]=1;});}catch(x){}
  equip=st.equipment.map(function(e){var id=String(e.id);return {id:id,ref:e.ref,ph:e.photo,k:e.kind,n:e.name,m:e.brand,cat:e.catalog,st:e.status,
    pt:e.patient_id?String(e.patient_id):null,fa:e.pharmacy_id?String(e.pharmacy_id):null,since:off(e.since),end:e.planned_end?off(e.planned_end):null,chk:off(e.next_check),
    px:e.week_price,buy:e.buy_price||0,days:e.rented_days||0,est:!!e.buy_estimated,link:e.link||'',rid:e.rental_id,docs:e.documents||[],prescription:e.prescription,scan:e.last_scan,fav:!!favs[id],
    h:e.events.map(function(v){return {d:off(v.at),txt:v.text,q:v.id,t:v.at.slice(11,16),by:v.by};})};});
  DONE=st.closed.map(function(c){var e=byId(String(c.equipment.id))||{id:String(c.equipment.id),ref:c.equipment.ref,n:c.equipment.name,ph:c.equipment.photo,k:c.equipment.kind,px:c.equipment.week_price,st:'dispo',stub:true};
    var s=off(c.start),en=off(c.end);return {e:e,p:pat(String(c.patient_id))||{n:'—'},fa:phar(String(c.pharmacy_id))||{n:'—'},start:s,end:en,dur:en-s,sum:c.amount};});
  if(!phar(rentFa)&&PHARM[0])rentFa=PHARM[0].id;

/* Géolocalisation au moment du scan */
function getPos(cb){
  if(!navigator.geolocation)return cb(null);var done=false,t=setTimeout(function(){if(!done){done=true;cb(null);}},9000);
  navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(t);cb({lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)});},
    function(){if(done)return;done=true;clearTimeout(t);cb(null);},{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
}
function recordScan(e,src){
  if(!ONLINE||!e)return;
  getPos(function(pos){srv('POST','scans',{equipment:e.id,source:src,lat:pos?pos.lat:null,lon:pos?pos.lon:null,accuracy:pos?pos.acc:null})
    .then(loadState).then(function(){if(S.cur===e.id&&detail.classList.contains('open'))loadHistory(e.id);}).catch(function(){});});
}
function stamp(at){var d=off(at);return (d===0?'Aujourd\'hui':d===-1?'Hier':fmt(d))+' à '+at.slice(11,16).replace(':',' h ');}
function mapsLink(lat,lon,label){return 'https://maps.apple.com/?ll='+lat+','+lon+'&q='+encodeURIComponent(label)+'&z=18';}
function scanRow(e){

  return '<div><dt>'+ic('tag')+'Dernier scan</dt><dd>'+stamp(s.at)+'<small class="dsub">'+esc(s.by||'')+' · '+src+'</small>'
    +(s.lat!=null?'<a class="more geo" target="_blank" rel="noopener" href="'+mapsLink(s.lat,s.lon,e.ref)+'">'+ic('pin')+'Position ±'+Math.max(1,Math.round(s.accuracy||0))+' m</a>':'<small class="dsub">Position non partagée</small>')+'</dd></div>';
}
function loadHistory(id){

/* ---------- Scan de l'ordonnance vers le serveur de la pharmacie ----------
   Le document est préparé en PDF sur l'appareil puis enregistré dans le dossier de la pharmacie :
   écriture directe dans le dossier réseau (Chrome ou Edge sur ordinateur), menu de partage « Enregistrer dans Fichiers »
   (iPhone, Android, app iPhone) ou téléchargement. Il n'est jamais envoyé au serveur MédiParc. */
var scanFile=null,scanUrl=null;
function slug(t){return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'patient';}
function scanName(e,ext){var t=new Date(),d=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2)+'_'+('0'+t.getHours()).slice(-2)+'h'+('0'+t.getMinutes()).slice(-2);
  return 'Ordonnance_'+d+'_'+e.ref+'_'+slug(initials(pat(e.pt).n)||'X')+'.'+(ext||'pdf');}
function bytesOf(str){var b=new Uint8Array(str.length);for(var i=0;i<str.length;i++)b[i]=str.charCodeAt(i)&255;return b;}
/* PDF d'une page contenant la photo (JPEG), à la largeur d'une page A4. */
function jpegToPdf(jpg,w,h){
  var pw=595.28,ph=Math.round(pw*h/w*100)/100,parts=[],len=0,offs=[];
  function add(x){var b=typeof x==='string'?bytesOf(x):x;parts.push(b);len+=b.length;}
  function obj(n,body){offs[n]=len;add(n+' 0 obj\n');body();add('\nendobj\n');}
  var content='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
  add('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n');
  obj(1,function(){add('<< /Type /Catalog /Pages 2 0 R >>');});
  obj(2,function(){add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');});
  obj(3,function(){add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');});
  obj(4,function(){add('<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');add(jpg);add('\nendstream');});
  obj(5,function(){add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');});
  var xref=len,x='xref\n0 6\n0000000000 65535 f \n';for(var i=1;i<=5;i++)x+=('000000000'+offs[i]).slice(-10)+' 00000 n \n';
  add(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
function extOf(f){var m=/\.([A-Za-z0-9]{1,6})$/.exec(f.name||'');return m?m[1].toLowerCase():((f.type||'').split('/')[1]||'bin').replace(/[^a-z0-9]/g,'').slice(0,6)||'bin';}
/* Image lisible par le navigateur : convertie en PDF. PDF ou format non lisible (TIFF, HEIC sur certains navigateurs…) : conservé tel quel. */
function prepareScan(f){
  if(f.type==='application/pdf'||extOf(f)==='pdf')return Promise.resolve({blob:f,ext:'pdf',type:'application/pdf'});
  return makeScanPdf(f).then(function(pdf){return {blob:pdf,ext:'pdf',type:'application/pdf'};},function(){return {blob:f,ext:extOf(f),type:f.type||'application/octet-stream',raw:true};});
}
function makeScanPdf(f){
  if(f.type==='application/pdf')return Promise.resolve(f);
  return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(f);
    im.onload=function(){var k=Math.min(1,2400/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
      var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){if(!b)return rej(new Error('Image illisible'));b.arrayBuffer().then(function(ab){res(jpegToPdf(new Uint8Array(ab),c.width,c.height));});},'image/jpeg',.85);};
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('Ce fichier n\'est pas une image lisible. Envoyez une photo ou un PDF.'));};im.src=u;});
}
/* Dossier choisi sur l'ordinateur (mémorisé sur cet appareil uniquement). */
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('mediparc',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbGet(k){return idb().then(function(d){return new Promise(function(res){var t=d.transaction('kv').objectStore('kv').get(k);t.onsuccess=function(){res(t.result||null);};t.onerror=function(){res(null);};});}).catch(function(){return null;});}
function idbSet(k,v){return idb().then(function(d){return new Promise(function(res){var t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res;});}).catch(function(){});}
var dirHandle=null;
function canPickDir(){return 'showDirectoryPicker' in window;}
function nativeSave(){return window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.save;}
function canShareFile(f){try{return !!(navigator.canShare&&navigator.canShare({files:[f]}));}catch(x){return false;}}
function scanSheet(){
  var e=byId(S.cur);if(!e||!scanFile)return;var f=scanFile,dirName=dirHandle?dirHandle.name:'';

function shrink(f){

    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b||f);},'image/jpeg',.85);};
    im.onerror=function(){URL.revokeObjectURL(u);res(f);};im.src=u;});
}

  var ms=off(m+'-01'),nx=off(shiftMonth(m,1)+'-01'),L=[];

      return '<button class="row" data-user="'+x.id+'"><span class="avatar">'+initials(x.name)+'</span><span class="body"><div class="t">'+esc(x.name)+'</div><div class="s w2">'+esc(x.login)+' · '+ROLE_L[x.role]+(x.pharmacy?' · '+esc(x.pharmacy):'')+'</div></span><span class="pill '+st[1]+'">'+st[0]+'</span></button>';}).join('')||'<div class="empty">Chargement…</div>')+'</div></section>'
    +'<section>'+secH('cross','Pharmacies',badge(PHARM.length))+'<div class="list">'+PHARM.map(function(f){return '<div class="row"><span class="ico a-ok"><svg viewBox="0 0 24 24">'+ICON.cross+'</svg></span><span class="body"><div class="t">'+esc(f.n)+'</div><div class="s">'+esc(f.c)+'</div></span></div>';}).join('')+'</div></section></div></div>';
}
function chipSel(name,opts,cur){return '<div class="durs" data-sel="'+name+'">'+opts.map(function(o){return '<button type="button" class="chip" data-opt="'+esc(o[0])+'" aria-pressed="'+(cur===o[0])+'">'+esc(o[1])+'</button>';}).join('')+'</div>';}
function selVal(name){var b=document.querySelector('[data-sel="'+name+'"] .chip[aria-pressed="true"]');return b?b.dataset.opt:'';}
function userForm(){
  openSheet('<h2>Nouveau compte</h2><form id="f-user" class="fform" novalidate><label class="fld" for="u-name">Nom affiché</label><input class="gin" id="u-name" placeholder="Pharmacie du Lagon ou Marie Teriitahi">'
    +'<label class="fld" for="u-login">Identifiant de connexion</label><input class="gin" id="u-login" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="lagon">'
    +'<label class="fld">Rôle</label>'+chipSel('role',[['pharmacie','Pharmacie'],['equipe','Équipe du parc'],['admin','Administrateur']],'pharmacie')
    +'<label class="fld">Pharmacie (pour un compte pharmacie)</label>'+chipSel('pharm',PHARM.map(function(f){return [f.id,f.n];}),'')
    +'<p class="err" id="u-err" hidden></p><button class="btn" type="submit">Créer le compte</button><button class="btn soft" type="button" data-act="close-sheet">Annuler</button></form>');
  sheet.style.height='92%';
}
function pharmForm(){
  openSheet('<h2>Nouvelle pharmacie</h2><form id="f-pharm" class="fform" novalidate><label class="fld" for="ph-name">Nom</label><input class="gin" id="ph-name" placeholder="Pharmacie de Arue">'
    +'<label class="fld" for="ph-c">Commune</label><input class="gin" id="ph-c" placeholder="Arue"><p class="err" id="ph-err" hidden></p><button class="btn" type="submit">Ajouter la pharmacie</button><button class="btn soft" type="button" data-act="close-sheet">Annuler</button></form>');
}
function patForm(){
  openSheet('<h2>Nouveau bénéficiaire</h2><form id="f-pat" class="fform" novalidate><label class="fld" for="pa-name">Nom</label><input class="gin" id="pa-name" placeholder="Prénom et nom">'
    +'<label class="fld">Commune</label>'+chipSel('commune',COMMUNES.map(function(c){return [c,c];}),'')
    +'<label class="fld" for="pa-addr">Adresse</label><input class="gin" id="pa-addr" placeholder="PK, quartier, servitude…">'
    +'<label class="fld" for="pa-tel">Téléphone</label><input class="gin" id="pa-tel" type="tel" inputmode="tel" autocomplete="off" placeholder="87 12 34 56">'
    +'<p class="note">Seuls le nom, l\'adresse et le téléphone sont enregistrés, chiffrés. Ne saisissez aucune information médicale.</p>'
    +'<p class="err" id="pa-err" hidden></p><button class="btn" type="submit">Ajouter</button><button class="btn soft" type="button" data-act="assign">Retour</button></form>');
  sheet.style.height='92%';
}
function pwdSheet(login,pw,title){
  openSheet('<h2>'+title+'</h2><p class="sub">Transmettez ces informations à la personne. Le mot de passe est provisoire : il lui sera demandé d\'en choisir un à la première connexion. Il ne sera plus affiché ensuite.</p>'
    +'<div class="pwbox"><small>Adresse</small><code>'+esc(location.origin)+'/materiel/</code><small>Identifiant</small><code>'+esc(login)+'</code><small>Mot de passe provisoire</small><code id="pw-show">'+esc(pw)+'</code></div>'
    +'<button class="btn" data-copy="'+esc('Adresse : '+location.origin+'/materiel/\nIdentifiant : '+login+'\nMot de passe provisoire : '+pw)+'">'+svg('copy')+'Copier</button><button class="btn soft" data-act="close-sheet">Fermer</button>');
}
function userSheet(id){
  var x=usersCache.filter(function(u){return String(u.id)===String(id);})[0];if(!x)return;
  menuSheet(esc(x.name),[['data-ureset="'+x.id+'"','tag','Réinitialiser le mot de passe','Un mot de passe provisoire sera créé'],
    ['data-uactive="'+x.id+'" data-v="'+(x.active?0:1)+'"',x.active?'warn':'okc',x.active?'Désactiver le compte':'Réactiver le compte',x.active?'La personne ne pourra plus se connecter':'La personne pourra de nouveau se connecter']]);
}
function submitForm(id){
  if(id==='f-user'){var role=selVal('role');srv('POST','users',{name:$('u-name').value,login:$('u-login').value,role:role,pharmacy:role==='pharmacie'?selVal('pharm'):null})
      .then(function(r){pwdSheet(r.login,r.password,'Compte créé');return srv('GET','users');}).then(function(r){usersCache=r.users;renderAccounts();}).catch(function(e){gateErr('u-err',e.message);});}
  else if(id==='f-pharm'){srv('POST','pharmacies',{name:$('ph-name').value,commune:$('ph-c').value}).then(loadState).then(function(){closeSheet();renderAccounts();toast('Pharmacie ajoutée');}).catch(function(e){gateErr('ph-err',e.message);});}
  else if(id==='f-presc'){var pe=byId(S.cur);if(!$('pr-ok').checked)return gateErr('pr-err','Cochez la case pour confirmer que la pharmacie détient l\'ordonnance.');
    srv('POST','rentals/'+pe.rid+'/prescription',{date:$('pr-date').value,ref:$('pr-ref').value,attest:true}).then(loadState).then(function(){closeSheet();refresh();loadHistory(pe.id);toast('Ordonnance vérifiée');}).catch(function(err){gateErr('pr-err',err.message);});}
  else if(id==='f-pat'){srv('POST','patients',{name:$('pa-name').value,commune:selVal('commune'),address:$('pa-addr').value,phone:$('pa-tel').value}).then(loadState).then(function(){pickPatient();toast('Bénéficiaire ajouté');}).catch(function(e){gateErr('pa-err',e.message);});}
}
function accountSheet(){
  var it=[];
  if(ONLINE&&ME)it.push(['data-act="noop"','users',esc(ME.name),ROLE_L[ROLE]+(ME.pharmacy?' · '+esc(ME.pharmacy.name):'')+' · '+esc(ME.login)]);
  return it;
}

/* ---------- Actions ---------- */
function act(a,e){
  if(ONLINE){mut('equipment/'+e.id+'/action',{action:a},{return:'Retour enregistré',clean:'Désinfection validée',repair:'Matériel remis en stock',fault:'Panne signalée'}[a]);return;}
  if(a==='return'){var n=pat(e.pt).n;e.st='desinf';e.pt=null;e.fa=null;e.end=null;e.since=0;e.h.push(ev(0,'Retour de location ('+n+'), en attente de désinfection'));toast('Retour enregistré');}
  else if(a==='clean'){e.st='dispo';e.since=0;e.h.push(ev(0,'Désinfection validée, remis en stock'));toast('Désinfection validée');}
  else if(a==='repair'){e.st='dispo';e.since=0;if(e.chk<0)e.chk=365;e.h.push(ev(0,'Maintenance clôturée, contrôle conforme'));toast('Matériel remis en stock');}
  else if(a==='fault'){e.st='maint';e.pt=null;e.fa=null;e.end=null;e.since=0;e.h.push(ev(0,'Panne signalée, envoyé à l\'atelier'));toast('Panne signalée');}
  renderDetail();
}
document.addEventListener('click',function(x){
  var t=x.target.closest('[data-opt],[data-fmonth],[data-ffa],[data-deldoc],[data-deldocok],[data-user],[data-ureset],[data-uactive],[data-copy],[data-tab],[data-open],[data-act],[data-filter],[data-pick],[data-link],[data-place],[data-mode],[data-state],[data-tag],[data-map],[data-dur],[data-hist],[data-fav],[data-keb],[data-progid],[data-ltab],[data-extend],[data-pkeb],[data-zone],[data-pext],[data-cdays],[data-scroll],[data-rtab],[data-export],[data-fa],[data-rfa]');if(!t)return;
  var d=t.dataset;
  if(d.opt!==undefined){var grp=t.parentNode;[].forEach.call(grp.querySelectorAll('.chip'),function(c){c.setAttribute('aria-pressed',String(c===t));});return;}
  if(d.fmonth){fState.month=shiftMonth(fState.month,+d.fmonth);fData=null;render(true);return;}
  if(d.ffa!==undefined){fState.fa=d.ffa;fData=null;render(true);return;}
  if(d.deldoc){openSheet('<h2>Retirer cette ordonnance ?</h2><p class="sub">Le document sera supprimé du serveur.</p><button class="btn danger" data-deldocok="'+d.deldoc+'">Retirer</button><button class="btn soft" data-act="close-sheet">Annuler</button>');return;}
  if(d.deldocok){closeSheet();mut('documents/'+d.deldocok+'/delete',{},'Ordonnance retirée');return;}
  if(d.user){userSheet(d.user);return;}
  if(d.ureset){srv('POST','users/'+d.ureset+'/reset',{}).then(function(r){pwdSheet(r.login,r.password,'Mot de passe réinitialisé');return srv('GET','users');}).then(function(r){usersCache=r.users;renderAccounts();}).catch(errToast);return;}
  if(d.uactive){closeSheet();srv('POST','users/'+d.uactive+'/active',{active:d.v==='1'}).then(function(){return srv('GET','users');}).then(function(r){usersCache=r.users;renderAccounts();toast(d.v==='1'?'Compte réactivé':'Compte désactivé');}).catch(errToast);return;}
  if(d.copy){copyText(d.copy,'Copié');return;}
  if(d.act==='fact-copy'){copyText(factCsv(fData),'Facturation copiée pour un tableur');return;}
  if(d.act==='presc'){prescSheet();return;}
  if(d.act==='scan-presc'){var si=$('scan-in');si.value='';si.click();return;}
  if(d.act==='view-presc'){viewPresc(false);return;}
  if(d.act==='view-pick-dir'){closeSheet();viewPresc(true);return;}
  if(d.act==='import-presc'){var ii=$('import-in');ii.value='';ii.click();return;}
  if(d.act==='scan-save-dir'){saveToDir(false);return;}
  if(d.act==='scan-pick-dir'){saveToDir(true);return;}
  if(d.act==='scan-share'){shareScan();return;}
  if(d.act==='scan-cancel'){closeSheet();return;}
  if(d.act==='presc-del'){var de=byId(S.cur);closeSheet();mut('rentals/'+de.rid+'/prescription/delete',{},'Vérification annulée');return;}
  if(d.act==='add-doc'){var di=$('doc-in');di.value='';di.click();return;}
  if(d.act==='logout'){logout();return;}
  if(d.act==='gate-close'){gate.hidden=true;return;}
  if(d.act==='change-pwd'){closeSheet();showPwd(false);return;}
  if(d.act==='accounts'){closeSheet();openAccounts();return;}
  if(d.act==='new-user'){userForm();return;}
  if(d.act==='new-pharm'){pharmForm();return;}
  if(d.act==='new-pat'){patForm();return;}
  if(d.act==='open-ref'){openRef();return;}
  if(d.act==='reload'){location.reload();return;}
  if(d.act==='noop')return;
  if(d.rtab){closeSheet();S.rtab=d.rtab;S.tab='rap';render();}
  else if(d.export){copyText(csvRows(d.export),'Export copié dans le presse-papiers');}
  else if(d.cdays){S.cdays=+d.cdays;render(true);}
  else if(d.scroll){var se=$(d.scroll);if(se)main.scrollTo({top:se.offsetTop-8,behavior:'smooth'});}
  else if(d.ltab){S.ltab=d.ltab;render();}
  else if(d.extend&&ONLINE){mut('rentals/extend',{equipment:d.extend,days:7},'Retour repoussé d\'une semaine');}
  else if(d.extend){var ee=byId(d.extend);ee.end+=7;ee.h.push(ev(0,'Location prolongée d\'une semaine'));render(true);toast(ee.n+' : retour repoussé au '+fmt(ee.end));}
  else if(d.zone!==undefined){S.lzone=d.zone||null;closeSheet();render();}
  else if(d.act==='lsort'){S.lsort=(S.lsort+1)%LSORT.length;render(true);toast('Tri : '+LSORT[S.lsort][1]);}
  else if(d.act==='lfilter'){var zs=patients.map(function(p){return p.c;}).filter(function(c,i,a){return a.indexOf(c)===i;});openSheet('<h2>Filtrer les contrats</h2>'+(STAFF?'<label class="fld" style="text-align:center">Pharmacie</label><div class="durs"><button class="chip" data-fa="" aria-pressed="'+(!S.lfa)+'">Toutes</button>'+PHARM.map(function(f){return '<button class="chip" data-fa="'+f.id+'" aria-pressed="'+(S.lfa===f.id)+'">'+esc(f.n)+'</button>';}).join('')+'</div>':'')+'<label class="fld" style="text-align:center">Commune du bénéficiaire</label><div class="durs"><button class="chip" data-zone="" aria-pressed="'+(!S.lzone)+'">Toutes</button>'+zs.map(function(z){return '<button class="chip" data-zone="'+esc(z)+'" aria-pressed="'+(S.lzone===z)+'">'+esc(z)+'</button>';}).join('')+'</div><button class="btn soft" data-act="close-sheet">Fermer</button>');}
  else if(d.fa!==undefined){S.lfa=d.fa||null;closeSheet();S.tab='loc';S.ltab='cur';render();}
  else if(d.rfa){rentFa=d.rfa;pickPatient();}
  else if(d.pkeb){var pp=pat(d.pkeb);menuSheet(esc(pp.n),[['data-place="'+pp.id+'"','pin','Voir sur le plan',esc(pp.a)],['data-pext="'+pp.id+'"','cal','Prolonger d\'une semaine','Tous les équipements de ce bénéficiaire']]);}
  else if(d.pext&&ONLINE){closeSheet();mut('rentals/extend',{patient:d.pext,days:7},'Locations prolongées d\'une semaine');}
  else if(d.pext){equip.forEach(function(e){if(e.st==='loc'&&e.pt===d.pext){e.end+=7;e.h.push(ev(0,'Location prolongée d\'une semaine'));}});closeSheet();render(true);toast('Locations prolongées d\'une semaine');}
  else if(d.fav){var fe=byId(d.fav);fe.fav=!fe.fav;saveFavs();closeSheet();render(true);toast(fe.fav?'Ajouté aux favoris':'Retiré des favoris');}
  else if(d.keb)kebSheet(d.keb);
  else if(d.progid){closeSheet();writeTagFor(d.progid);}
  else if(d.hist){histDays=+d.hist;render(true);}
  else if(d.act==='quick')quickSheet();
  else if(d.act==='more')moreSheet();
  else if(d.act==='alerts')openSheet('<h2>À traiter · '+alerts().length+'</h2><div class="list">'+alertRows(alerts())+'</div><button class="btn soft" data-act="close-sheet">Fermer</button>');
  else if(d.act==='search'){closeSheet();S.tab=STAFF?'parc':'loc';S.mode='grid';render();var qi=$('q');if(qi)qi.focus();}
  else if(d.dur){rentDur=+d.dur;pickPatient();}
  else if(d.act==='extend'&&ONLINE){mut('rentals/extend',{equipment:S.cur,days:7},'Retour repoussé d\'une semaine');}
  else if(d.act==='extend'){var xe=byId(S.cur);xe.end+=7;xe.h.push(ev(0,'Location prolongée d\'une semaine'));renderDetail();toast('Retour repoussé au '+fmt(xe.end));}
  else if(d.map){openMap(d.map);}
  else if(d.tag){openTag(d.tag);}
  else if(d.act==='settings'){closeSheet();openSettings();}
  else if(d.act==='close-settings')closeSettings();
  else if(d.act==='save-uid')saveUid();
  else if(d.act==='scan-tag'){var tg=tagId;closeSheet();readTagFor(tg);}
  else if(d.act==='write-tag'){var tw=tagId;closeSheet();writeTagFor(tw);}
  else if(d.act==='copy-link'){var ke=byId(tagId);copyText(ke.link||defLink(ke),'Lien copié');}
  else if(d.act==='save-base')saveBase();
  else if(d.act==='clear-tag'&&ONLINE){var cf=byId(tagId);closeSheet();mut('equipment/'+cf.id+'/link',{link:''},'Puce retirée de '+cf.ref);}
  else if(d.act==='clear-tag'){var ce=byId(tagId);ce.link='';ce.h.push(ev(0,'Puce NFC retirée'));saveLinks();closeSheet();renderSettings();toast('Puce retirée de '+ce.ref);}
  else if(d.act==='clear-all'&&ONLINE){mut('links/reset',{mode:'clear'},'Toutes les puces sont effacées');}
  else if(d.act==='clear-all'){equip.forEach(function(e){e.link='';});saveLinks();renderSettings();toast('Toutes les puces sont effacées');}
  else if(d.act==='restore-all'&&ONLINE){mut('links/reset',{mode:'default'},'Liens par défaut rétablis');}
  else if(d.act==='restore-all'){equip.forEach(function(e){e.link=defLink(e);});saveLinks();renderSettings();toast('Liens par défaut rétablis');}
  else if(d.state){openState(d.state);}
  else if(d.place){closeSheet();var same=S.tab==='parc'&&S.mode==='plan';S.place=d.place;S.tab='parc';S.mode='plan';render(same);}
  else if(d.mode){closeSheet();S.mode=d.mode;S.tab='parc';render();}
  else if(d.tab){closeSheet();S.tab=d.tab;render();}
  else if(d.link){var lu=pendingLink;pendingLink=null;assignLink(byId(d.link),lu);}
  else if(d.open){closeSheet();openDetail(d.open);}
  else if(d.filter){closeSheet();S.filter=d.filter;S.mode='grid';S.tab='parc';render();}
  else if(d.pick&&ONLINE){closeSheet();mut('rentals',{equipment:S.cur,patient:d.pick,pharmacy:rentFa,days:rentDur},'Location démarrée');}
  else if(d.pick){var e=byId(S.cur),p=pat(d.pick);e.st='loc';e.pt=p.id;e.since=0;e.end=rentDur;e.fa=rentFa;e.h.push(ev(0,'Livré chez '+p.n+' par la '+phar(rentFa).n+' pour '+DURS.filter(function(x){return x[0]===rentDur;})[0][1]));closeSheet();renderDetail();toast('Location démarrée');}
  else if(d.act==='scan'){closeSheet();startScan();}
  else if(d.act==='close-sheet')closeSheet();
  else if(d.act==='credits')openSheet('<h2>Crédits photos</h2><p class="sub">Photos d\'illustration libres (Wikimedia Commons, Flickr), redimensionnées. Elles ne montrent pas les modèles exacts.</p><div class="plist">'+CREDITS.map(function(c){return '<div class="cred"><b>'+c[0]+'</b><span>'+c[1]+' · '+c[2]+'</span></div>';}).join('')+'</div><button class="btn soft" data-act="close-sheet">Fermer</button>');
  else if(d.act==='back')closeDetail();
  else if(d.act==='copy'){var cl=byId(S.cur).link;if(cl)copyText(cl,'Lien copié');else toast('Aucune puce associée');}
  else if(d.act==='assign')pickPatient();
  else if(d.act==='program')writeTagFor(S.cur);
  else if(S.cur)act(d.act,byId(S.cur));
});
document.addEventListener('input',function(x){if(x.target.id==='q'){S.q=x.target.value;$('parc-list').innerHTML=parcRows();}});
document.addEventListener('keydown',function(x){if((x.key==='Enter'||x.key===' ')&&x.target.classList&&x.target.classList.contains('card')){x.preventDefault();openDetail(x.target.dataset.open);return;}if(x.key==='Enter'&&x.target.id==='uid-in'){saveUid();return;}if(x.key==='Enter'&&x.target.id==='ref-in'){openRef();return;}if(x.key==='Enter'&&x.target.id==='base-in'){saveBase();return;}if(x.key==='Escape'){if(sheet.classList.contains('open'))closeSheet();else if(S.cur)closeDetail();else if(setOpen)closeSettings();}});
if(ONLINE){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/materiel/sw.js',{scope:'/materiel/'}).catch(function(){});
  srv('GET','me').then(function(r){setRole(r.me);if(r.me.must_change)showPwd(true);else enterApp();})
    .catch(function(e){if(e.status===401)showLogin();else gateShell('<h1>Serveur injoignable</h1><p class="gsub">Vérifiez la connexion internet, puis réessayez.</p><button class="btn" data-act="reload">Réessayer</button>');});
}else{buildTabs();render();openFromHash();}
})();
</script>
