<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>MédiParc NFC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : appli plein écran en une colonne (430 pt, iPhone 15 Pro Max) — en-tête, contenu défilant, barre d'onglets flottante avec bouton de scan central ; fiches et feuilles glissent par-dessus. */
:root{
  --bg:#EDF6F8; --bg-top:#C9EBF2; --hero2:#0E8F93; --deco:1; --tabbar:#0A3F4B; --tab-fg:#A9CBD2; --map-sea:#CDEDF3; --map-reef:#A9E2EA; --map-land:#CFE7C6; --map-line:#8FBF8E; --glow:rgba(11,110,125,.30); --surface:#FFFFFF; --surface-2:#E2EAEC; --ink:#0D2730; --muted:#5B7078; --line:#D5DFE1;
  --accent:#0A7C88; --accent-ink:#FFFFFF; --accent-soft:#D8EEF2;
  --hero:#0B5361; --hero-fg:#F2FAFB; --hero-muted:#A9CBD2; --hero-track:#1D5360;
  --ok:#1A7F54; --ok-soft:#DCF2E6; --warn:#A65F00; --warn-soft:#FBEBD0;
  --crit:#B8352B; --crit-soft:#FADFDC; --info:#3154C4; --info-soft:#E0E7FB;
  --seg-loc:#7FA0FF; --seg-dispo:#5FD6A0; --seg-desinf:#F5BE6B; --seg-maint:#FF9288;
  --shadow:0 1px 2px rgba(13,39,48,.06),0 8px 24px rgba(13,39,48,.07);
  --scrim:rgba(6,22,28,.45);
  --f-display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-text:"Inter",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07181E; --bg-top:#0D2D38; --hero2:#1A6E78; --deco:.75; --tabbar:#0A2A33; --tab-fg:#8FB3BB; --map-sea:#0C2F3A; --map-reef:#15505C; --map-land:#1F4A3A; --map-line:#3C7A5E; --glow:rgba(0,0,0,.45); --surface:#0F252D; --surface-2:#17333C; --ink:#E8F1F2; --muted:#8FA6AD; --line:#21404A;
  --accent:#4CC3D9; --accent-ink:#04222A; --accent-soft:#123C47;
  --hero:#123E4A; --hero-fg:#F2FAFB; --hero-muted:#9DC3CB; --hero-track:#0A2A33;
  --ok:#5AD39A; --ok-soft:#10382A; --warn:#F2B45A; --warn-soft:#3B2B0E;
  --crit:#FF8A7E; --crit-soft:#42201C; --info:#93ABFF; --info-soft:#1B2955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.6);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#07181E; --bg-top:#0D2D38; --hero2:#1A6E78; --deco:.75; --tabbar:#0A2A33; --tab-fg:#8FB3BB; --map-sea:#0C2F3A; --map-reef:#15505C; --map-land:#1F4A3A; --map-line:#3C7A5E; --glow:rgba(0,0,0,.45); --surface:#0F252D; --surface-2:#17333C; --ink:#E8F1F2; --muted:#8FA6AD; --line:#21404A;
  --accent:#4CC3D9; --accent-ink:#04222A; --accent-soft:#123C47;
  --hero:#123E4A; --hero-fg:#F2FAFB; --hero-muted:#9DC3CB; --hero-track:#0A2A33;
  --ok:#5AD39A; --ok-soft:#10382A; --warn:#F2B45A; --warn-soft:#3B2B0E;
  --crit:#FF8A7E; --crit-soft:#42201C; --info:#93ABFF; --info-soft:#1B2955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--hero) 0,var(--hero) 50%,var(--tabbar) 50%);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--bg-top),var(--bg) 360px)}
.deco{position:absolute;top:0;left:0;right:0;height:190px;pointer-events:none;opacity:var(--deco);z-index:1}
.deco svg{width:100%;height:100%;display:block}
.top,main,.tabs{position:relative;z-index:2}
.appbar{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:8px;padding-block:8px 16px;color:var(--hero-fg);background:linear-gradient(120deg,var(--hero),var(--hero2));border-radius:0 0 50% 50%/0 0 16px 16px}
.appbar .logo{width:38px;height:30px;flex:none;color:var(--hero-fg)}
.appbar .brand{flex:1;min-width:0;line-height:1.15}
.appbar .brand b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--seg-dispo)}
.appbar .brand b span{color:var(--hero-fg)}
.appbar .brand small{font-size:11.5px;color:var(--hero-muted)}
.abtn{position:relative;z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(6,40,48,.45);color:var(--hero-fg)}
.abtn svg{width:21px;height:21px}
.ndot{position:absolute;top:6px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--seg-maint);border:2px solid var(--hero)}
.subt{font-size:14px;color:var(--muted);margin-top:2px}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 14px}
.top .eyebrow{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.top .eyebrow svg{color:var(--accent);width:20px;height:20px}

.top .eyebrow.up{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.top h1{font-family:var(--f-display);font-size:31px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.demo-tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);padding:9px 14px;border-radius:99px;white-space:nowrap;box-shadow:var(--shadow);margin-bottom:6px}
.demo-tag svg{color:var(--accent)}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 20px;display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;min-height:34px}
.sec-h h2{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.015em}
.sec-h h2 svg{color:var(--accent);width:24px;height:24px}
.sec-h>span{font-size:13px;color:var(--muted)}
.badge{flex:none;min-width:30px;height:30px;padding:0 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center}
.more{text-decoration:none;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:99px}

/* Carte parc */
.hero{background:radial-gradient(120% 90% at 85% 0%,var(--hero2),transparent 60%),linear-gradient(140deg,var(--hero),var(--hero2));color:var(--hero-fg);border-radius:28px;padding:20px 18px 22px;border:1.5px solid rgba(255,255,255,.3);display:flex;flex-direction:column;gap:16px;box-shadow:0 16px 32px -8px var(--glow)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-8px}
.hero .lbl{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--hero-fg);margin-bottom:6px}
.hero .lbl svg{width:24px;height:24px}
.hero .occ{display:flex;align-items:center;gap:9px;min-width:0}
.hero .trend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--hero-muted);margin-top:-8px}
.hero .trend span{display:inline-flex;align-items:center;gap:3px;background:var(--seg-dispo);color:#0B3B2A;font-weight:700;font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap}
.hero .trend svg{width:12px;height:12px;stroke-width:3}
.hero .big{white-space:nowrap;font-family:var(--f-display);font-size:58px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .big small{font-size:28px;font-weight:700;margin-left:4px}
.hero .side{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--hero-muted);border-left:1px solid rgba(255,255,255,.22);padding:6px 0 6px 12px;gap:8px}
.hero .side svg{width:24px;height:24px;color:var(--hero-fg)}
.hero .side b{display:block;font-family:var(--f-display);font-size:21px;color:var(--hero-fg);font-weight:700;white-space:nowrap}
.segbar{display:flex;gap:3px;height:16px}
.segbar button{border-radius:7px;min-width:6px;transition:flex-grow .5s ease}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px;margin-top:-2px}
.legend button{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--hero-fg);padding:4px 6px;margin:0 -6px;border-radius:8px;min-width:0}
.legend button:active{background:rgba(255,255,255,.14)}
.sheet .list{overflow-y:auto;min-height:0;box-shadow:none;background:var(--bg)}
.sheet .list .row{min-height:68px}
.legend button:active{background:rgba(255,255,255,.14)}
.legend b{color:var(--hero-fg);font-weight:700;font-size:15px;margin-left:auto}
.legend .dot{width:9px;height:9px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}

/* Lignes */
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;min-height:72px}
.row:active,.mini:active,.pick:active{background:var(--surface-2)}
.row + .row{border-top:1px solid var(--line)}
.row .body{flex:1;min-width:0}
.row .t{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.row .s.si{display:flex;align-items:center;gap:6px;margin-top:2px}
.row .s.si{white-space:normal;align-items:flex-start}
.row .s.si svg{margin-top:1px}
.row .s.si span{min-width:0}
.row .pill+.chev{margin-left:-6px}
.row .pill{padding:6px 10px}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t.wrap{white-space:normal;font-weight:500;font-size:14px}
.row .chev{color:var(--muted);flex:none;opacity:.6}
.ico{width:52px;height:52px;border-radius:16px;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;flex:none}
.ico svg,.tab svg,.btn svg,.chev svg,.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.a-crit{background:var(--crit-soft);color:var(--crit)} .ico.a-warn{background:var(--warn-soft);color:var(--warn)}
.ico.a-info{background:var(--info-soft);color:var(--info)} .ico.a-ok{background:var(--ok-soft);color:var(--ok)}
.ph{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface-2);display:block}
.noimg{display:grid;place-items:center;width:100%;height:100%;color:var(--accent);background:var(--accent-soft)}
.noimg svg{width:44%;height:44%;max-width:84px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card .pic .noimg{position:absolute;inset:0}
.dhero .noimg{position:relative}
.ph img,.pic img{width:100%;height:100%;object-fit:cover;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .pic{position:relative;display:block;aspect-ratio:4/3;background:var(--surface-2)}
.card .pic img{position:absolute;inset:0}
main>*{flex:none}
.card .pic .pill{position:absolute;left:8px;top:8px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.card .meta{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;min-width:0}
.card .t{font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ft{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px}
.card .dt{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt svg{color:var(--accent);width:15px;height:15px}
.card .pxc{flex:none;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:5px 8px;border-radius:9px;white-space:nowrap}
.card .px{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--accent);margin-top:2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:var(--gl);margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding:2px var(--gr) 14px var(--gl);margin-bottom:-14px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{flex:none;width:178px;scroll-snap-align:start}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:16px;padding:4px;gap:4px}
.seg button{display:flex;justify-content:center;align-items:center;gap:7px;padding:10px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] svg{color:var(--accent)}
.mapcard{display:block;width:100%;background:var(--map-sea);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.mapcard svg.map{display:block;width:100%;height:auto}
.mapfoot>div{min-width:0}
.mapfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);padding:12px 14px;text-align:left}
.mapfoot b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px}
.mapfoot span{font-size:13px;color:var(--muted)}
.mp-l{font:600 10.5px var(--f-text);fill:var(--ink);paint-order:stroke;stroke:var(--map-sea);stroke-width:3px;stroke-linejoin:round;text-anchor:middle}
.mp-c{font:700 12px var(--f-display);fill:var(--hero-fg);text-anchor:middle}
.mp-r{font:600 8.5px var(--f-text);letter-spacing:.14em;fill:var(--map-line);text-anchor:middle}
.mp-k{font:500 9px var(--f-text);fill:var(--muted)}
.map [data-place]{cursor:pointer}
.rent{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.rent .cols{display:grid;grid-template-columns:1fr 1fr}
.rent .cols>div+div{border-left:1px solid var(--line);padding-left:16px}
.rent small{display:block;font-size:12.5px;color:var(--muted)}
.rent b{display:block;font-family:var(--f-display);font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.rent .late b{color:var(--crit)}
.rent .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{display:block;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--hero),var(--hero2))}
.bar.over i{background:var(--crit)}
.bar.done i{background:var(--ok)}
.pct{flex:none;font-family:var(--f-display);font-size:17px;font-weight:700;color:var(--accent)}
.pct.ok{color:var(--ok)}
.rent b.pct{display:inline;font-size:20px}
.rent .cols b{font-size:20px}
.prow .bar{height:6px;margin:5px 0 3px}
.more-d summary{list-style:none;cursor:pointer;align-self:center;text-align:center;font-size:14px;font-weight:600;color:var(--accent);padding:10px}
.more-d summary::-webkit-details-marker{display:none}
.more-d summary::after{content:" ▾"}
.more-d[open] summary::after{content:" ▴"}
.mini .bar{height:4px;margin-top:5px}
.durs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.durs .chip{background:var(--bg)}
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px}
.kpi{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:11px 9px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.kpi svg.i{width:24px;height:24px;color:var(--accent);margin-bottom:3px}
.kpi b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.kpi b small{font-size:11px;font-weight:700}
.kpi span{font-size:11px;color:var(--muted);line-height:1.25}
.kpi .tg{align-self:flex-start;margin-top:3px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;color:var(--ok);background:var(--ok-soft);display:inline-flex;align-items:center;gap:2px}
.kpi .tg.cr{color:var(--crit);background:var(--crit-soft)}
.kpi .tg svg{width:10px;height:10px;stroke-width:3}
.badge.red{background:var(--crit);color:var(--surface)}
.tagp{flex:none;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:8px}
.viz{display:grid;grid-template-columns:1.15fr 1fr;gap:10px}
.vizc{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px 10px;min-width:0}
.vizc svg{display:block;width:100%;height:auto}
.ax{font:500 9px var(--f-text);fill:var(--muted)}
.axv{font:700 10.5px var(--f-display);fill:var(--hero-fg)}
.dn{font:700 20px var(--f-display);fill:var(--ink);text-anchor:middle}
.dl{font:500 9px var(--f-text);fill:var(--muted);text-anchor:middle}
.dleg{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.dleg button{display:flex;align-items:center;gap:6px;font-size:11.5px;width:100%}
.dleg b{margin-left:auto;font-weight:700}
.dleg i{font-style:normal;color:var(--muted);width:34px;text-align:right}
.dleg .dot{width:9px;height:9px}
.seg.sm{grid-template-columns:auto auto;border-radius:99px;padding:3px}
.seg.sm button{padding:6px 11px;font-size:12.5px;border-radius:99px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:16px;background:var(--bg);font-weight:600;font-size:15px}
.menu button svg{width:24px;height:24px;color:var(--accent);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu button small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.credits{align-self:center;font-size:13px;color:var(--muted);text-decoration:underline;padding:8px}
.cred{font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.cred b{display:block;font-weight:600}.cred span{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;flex:none}
.p-loc{background:var(--info-soft);color:var(--info)} .p-dispo{background:var(--ok-soft);color:var(--ok)}

function sem(n){var w=Math.floor(n/7),d=n%7;return n<14?jours(n):w+' sem.'+(d?' '+d+' j':'');}
/* Durée de location : écoulée, prévue, restante (négative = retard). */
function rent(e){var el=-e.since,tot=e.end-e.since;return {el:el,tot:tot,left:e.end,pct:Math.max(3,Math.min(100,Math.round(el/Math.max(tot,1)*100)))};}
function leftTxt(r){return r.left<0?'retard de '+jours(-r.left):r.left===0?'retour aujourd\'hui':'reste '+sem(r.left);}
function rentCard(e){
  var r=rent(e),late=r.left<0;
  return '<div class="rent"><div class="cols"><div><small>Loué depuis</small><b class="num">'+(r.el===0?'Aujourd\'hui':sem(r.el))+'</b><small>début le '+fmt(e.since)+'</small></div>'
    +'<div class="'+(late?'late':'')+'"><small>'+(late?'En retard de':r.left===0?'Retour prévu':'Encore')+'</small><b class="num">'+(late?sem(-r.left):r.left===0?'Aujourd\'hui':sem(r.left))+'</b><small>retour le '+fmt(e.end)+'</small></div></div>'

  equip.forEach(function(e){if(e.chk<0)al.push({o:e.id,k:'clock',c:'a-crit',t:'Contrôle en retard de '+(-e.chk)+' j',s:e.n+' · '+e.ref,g:['Retard','p-maint']});});
  equip.forEach(function(e){if(e.st==='loc'&&e.end===0)al.push({o:e.id,k:'ret',c:'a-info',t:'Retour prévu aujourd\'hui',s:e.n+' · '+pat(e.pt).n,g:['Retour','p-loc']});});
  var nd=count('desinf');
  if(nd)al.push({tab:'ent',k:'drop',c:'a-warn',t:nd+' désinfection'+(nd>1?'s':'')+' en attente',s:'À valider avant remise en stock',g:['Hygiène','p-desinf']});
  return al;
}
function alertRows(al){
  return al.map(function(a){return '<button class="row" '+(a.o?'data-open="'+a.o+'"':'data-tab="'+a.tab+'"')+'><span class="ico '+a.c+'"><svg viewBox="0 0 24 24">'+ICON[a.k]+'</svg></span><span class="body"><div class="t">'+esc(a.t)+'</div><div class="s">'+esc(a.s)+'</div></span><span class="tagp '+a.g[1]+'">'+a.g[0]+'</span><span class="chev">'+ICON.chev+'</span></button>';}).join('')
    ||'<div class="empty">Rien à signaler, le parc est à jour.</div>';
}
/* Historique du taux d'occupation : valeurs de démonstration, la dernière est le taux réel du jour. */
var HIST=[36,35,38,37,40,39,41,40,38,41,43,42,44,43,41,42,44,46,45,44,43,45,47,46,38,42,41,45,44,48];
var histDays=7;
function occChart(occ,wide){
  var v=HIST.slice(-(histDays-1)).concat([occ]),n=v.length;
  var lo=Math.floor(Math.min.apply(null,v)/10)*10,hi=Math.ceil((Math.max.apply(null,v)+1)/10)*10;if(hi-lo<20)lo=Math.max(0,hi-20);
  var W=wide?370:196,H=wide?190:150,L=30,R=12,T=26,B=22,x=function(i){return L+(W-L-R)*i/(n-1);},y=function(p){return T+(H-T-B)*(1-(p-lo)/(hi-lo));};
  var pts=v.map(function(p,i){return x(i).toFixed(1)+' '+y(p).toFixed(1);}),g='',step=(hi-lo)/((hi-lo)>30?(hi-lo)/20:(hi-lo)/10);
  for(var p=lo;p<=hi;p+=step)g+='<path d="M'+L+' '+y(p).toFixed(1)+'H'+(W-R)+'" stroke="var(--line)" stroke-width="1"/><text class="ax" x="'+(L-5)+'" y="'+(y(p)+3).toFixed(1)+'" text-anchor="end">'+p+' %</text>';
  var lab='',every=wide?(n<=7?1:5):(n<=7?2:10);
  for(var i=n-1;i>=0;i-=every)lab+='<text class="ax" x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===n-1?'end':'middle')+'">'+dateOf(i-n+1).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}).replace('.','')+'</text>';
  var lx=x(n-1),ly=y(occ);
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Taux d\'occupation sur '+n+' jours, '+occ+' % aujourd\'hui"><defs><linearGradient id="og" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--hero2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--hero2)" stop-opacity="0"/></linearGradient></defs>'
    +g+'<path d="M'+pts.join('L')+'L'+lx.toFixed(1)+' '+(H-B)+'L'+L+' '+(H-B)+'Z" fill="url(#og)"/><path d="M'+pts.join('L')+'" fill="none" stroke="var(--hero2)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<rect x="'+(lx-34).toFixed(1)+'" y="'+(ly-25).toFixed(1)+'" width="42" height="17" rx="6" fill="var(--hero)"/><text class="axv" x="'+(lx-13).toFixed(1)+'" y="'+(ly-13).toFixed(1)+'" text-anchor="middle">'+occ+' %</text>'
    +'<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="4.5" fill="var(--surface)" stroke="var(--hero2)" stroke-width="2.4"/>'+lab+'</svg>';
}
function donut(){
  var tot=equip.length,C=2*Math.PI*38,off=0,arcs='',leg='';
  ['loc','dispo','desinf','maint'].forEach(function(st){
    var c=count(st),len=C*c/tot;
    if(c)arcs+='<circle cx="55" cy="55" r="38" fill="none" stroke="var('+STATUS[st].seg+')" stroke-width="15" stroke-dasharray="'+Math.max(0,len-2).toFixed(2)+' '+(C-Math.max(0,len-2)).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 55 55)"/>';
    off+=len;
    leg+='<button data-state="'+st+'"><span class="dot" style="background:var('+STATUS[st].seg+')"></span>'+STATUS[st].l+'<b class="num">'+c+'</b><i class="num">'+Math.round(c/tot*100)+' %</i></button>';
  });
  return '<svg viewBox="0 0 110 110" style="max-width:120px;margin:0 auto" role="img" aria-label="Répartition du parc par état">'+arcs+'<text class="dn" x="55" y="57">'+tot+'</text><text class="dl" x="55" y="70">Équipements</text></svg><div class="dleg">'+leg+'</div>';
}

  var tot=equip.length,nLoc=count('loc'),occ=Math.round(nLoc/tot*100);
  var rev=equip.filter(function(e){return e.st==='loc';}).reduce(function(a,e){return a+e.px;},0);
  var seg=['loc','dispo','desinf','maint'].map(function(s){return '<button data-state="'+s+'" aria-label="'+STATUS[s].l+' : '+count(s)+'" style="flex-grow:'+count(s)+';background:var('+STATUS[s].seg+')"></button>';}).join('');
  var leg=['loc','dispo','desinf','maint'].map(function(s){return '<button data-state="'+s+'"><span class="dot" style="background:var('+STATUS[s].seg+')"></span>'+STATUS[s].l+'<b class="num">'+count(s)+'</b></button>';}).join('');
  var al=alerts(),dispo=equip.filter(function(e){return e.st==='dispo';}),nm=count('maint');

    +'<div class="side">'+ic('coins')+'<div><b class="num">'+xpf(rev)+'</b>de revenus par semaine</div></div></div><div class="trend"><span>'+ic('up')+'+5 %</span>vs semaine précédente</div><div class="segbar">'+seg+'</div><div class="legend">'+leg+'</div></div>'
    +'<div class="kpis"><button class="kpi" data-tab="loc">'+ic('coins')+'<b class="num">'+rev.toLocaleString('fr-FR').replace(/\s/g,' ')+' <small>XPF</small></b><span>Revenus / semaine</span><span class="tg">'+ic('up')+'+5 %</span></button>'
    +'<button class="kpi" data-tab="parc">'+ic('cal')+'<b class="num">'+tot+'</b><span>Équipements dans le parc</span></button>'
    +'<button class="kpi" data-act="alerts">'+ic('okc')+'<b class="num">'+al.length+'</b><span>Actions à traiter</span></button>'
    +'<button class="kpi" data-state="maint">'+ic('tool')+'<b class="num">'+nm+'</b><span>Maintenance</span>'+(nm?'<span class="tg cr">en cours</span>':'')+'</button></div>'
    +'<section>'+secH('clip','À traiter<span class="badge red num" style="margin-left:4px">'+al.length+'</span>','<button class="more" data-tab="ent">Tout voir'+ic('arrow')+'</button>')+'<div class="list">'+alertRows(al)+'</div></section>'
    +'<section>'+secH('bars','Aperçu du parc','<div class="seg sm"><button data-hist="7" aria-pressed="'+(histDays===7)+'">7 jours</button><button data-hist="30" aria-pressed="'+(histDays===30)+'">30 jours</button></div>')
    +'<div class="viz"><div class="vizc">'+occChart(occ)+'</div><div class="vizc">'+donut()+'</div></div></section>'
    +(dispo.length?'<section>'+secH('lit','Prêt à louer','<button class="more" data-filter="dispo">Tout voir'+ic('arrow')+'</button>')+'<div class="hscroll">'+dispo.map(function(e){return card(e,e.ref+' · '+xpf(e.px)+' / sem.');}).join('')+'</div></section>':'')
    +'<section>'+secH('pin','Où est le matériel','<button class="more" data-mode="plan">Ouvrir'+ic('arrow')+'</button>')+'<div class="mapcard">'+mapSvg(allPins(),null,true)+'</div></section>';
}
function viewRap(){
  var acts=[];
  equip.forEach(function(e){e.h.forEach(function(h){acts.push({e:e,h:h});});});
  acts.sort(function(a,b){return b.h.d-a.h.d||b.h.q-a.h.q;});
  var act=acts.slice(0,8).map(function(a){return '<button class="row" data-open="'+a.e.id+'">'+ph(a.e)+'<span class="body"><div class="t wrap">'+esc(a.h.txt)+'</div><div class="s">'+a.e.ref+' · '+rel(a.h.d)+'</div></span></button>';}).join('');
  var occ=Math.round(count('loc')/equip.length*100);
  return '<section>'+secH('coins','Rentabilité du parc')+parcProfit()+'</section>'
    +'<section>'+secH('bars','Taux d\'occupation','<div class="seg sm"><button data-hist="7" aria-pressed="'+(histDays===7)+'">7 jours</button><button data-hist="30" aria-pressed="'+(histDays===30)+'">30 jours</button></div>')+'<div class="vizc">'+occChart(occ,true)+'</div></section>'
    +'<section>'+secH('hist','Activité récente')+'<div class="list">'+act+'</div></section>';
}
function viewParc(){
  var CI={all:'grid',loc:'lit',dispo:'okc',desinf:'drop',maint:'gear'};
  var chips=[['all','Tout']].concat(Object.keys(STATUS).map(function(s){return [s,STATUS[s].l];})).map(function(c){
    var n=c[0]==='all'?equip.length:count(c[0]);
    return '<button class="chip" data-filter="'+c[0]+'" aria-pressed="'+(S.filter===c[0])+'">'+ic(CI[c[0]])+c[1]+' · '+n+'</button>';}).join('');
  var seg='<div class="seg"><button data-mode="grid" aria-pressed="'+(S.mode==='grid')+'">'+ic('grid')+'Liste</button><button data-mode="plan" aria-pressed="'+(S.mode==='plan')+'">'+ic('pin')+'Plan</button></div>';
  if(S.mode==='plan'){
    if(!atPlace(S.place).length)S.place=allPins()[0].id;
    var pl=place(S.place),here=atPlace(S.place);
    return seg+'<div class="mapcard">'+mapSvg(allPins(),S.place,true)+'<div class="mapfoot"><div><b>'+esc(pl.n)+'</b><span>'+esc(pl.a)+'</span></div>'+mapBtn(S.place)+'</div></div>'
      +'<section>'+secH('lit','Matériel sur place',badge(here.length))+'<div class="list">'+here.map(function(e){return rowEq(e,e.ref+' · '+e.m);}).join('')+'</div></section>';
  }
  return seg+'<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4 4"/></svg><input id="q" type="search" placeholder="Nom, référence ou patient" value="'+esc(S.q)+'" autocomplete="off" aria-label="Rechercher un équipement"><button class="sbtn" data-act="scan" aria-label="Scanner une puce">'+ic('frame')+'</button></div>'
    +'<div class="chips">'+chips+'</div><div class="grid" id="parc-list">'+parcRows()+'</div><button class="credits" data-act="credits">Crédits photos</button>';
}
function parcRows(){
  var q=S.q.trim().toLowerCase();
  var r=equip.filter(function(e){
    if(S.filter!=='all'&&e.st!==S.filter)return false;
    if(!q)return true;
    return (e.n+' '+e.ref+' '+e.m+' '+(e.pt?pat(e.pt).n:'')).toLowerCase().indexOf(q)>=0;
  }).map(function(e){
    return card(e,null,'<span class="ft"><span class="dt">'+ic('cal')+(e.st==='loc'?(function(r){return r.left<0?'Retard '+(-r.left)+' j':r.left===0?'Retour auj.':'Reste '+r.left+' j';})(rent(e)):(e.since===0?'Aujourd\'hui':fmt(e.since)))+'</span><span class="pxc num">'+xpf(e.px)+'</span></span>');
  }).join('');
  return r||'<div class="empty" style="grid-column:1/-1">Aucun équipement ne correspond.</div>';
}
function parcProfit(){
  var inv=0,rev=0;equip.forEach(function(e){inv+=e.buy;rev+=profit(e).rev;});
  var pct=Math.round(rev/inv*100),done=equip.filter(function(e){return profit(e).pct>=100;}).length;
  var rows=equip.slice().sort(function(a,b){return profit(b).pct-profit(a).pct;}).map(function(e){
    var r=profit(e);
    return '<button class="row prow" data-open="'+e.id+'">'+ph(e)+'<span class="body"><div class="t">'+esc(e.n)+'</div><span class="bar'+(r.pct>=100?' done':'')+'"><i style="width:'+Math.max(3,Math.min(100,r.pct))+'%"></i></span><div class="s">'+xpf(r.rev)+' sur '+xpf(e.buy)+'</div></span><b class="pct num'+(r.pct>=100?' ok':'')+'">'+r.pct+' %</b></button>';}).join('');
  return '<div class="rent"><div class="cols"><div><small>Loyers encaissés</small><b class="num">'+xpf(rev)+'</b><small>depuis l\'achat du matériel</small></div>'
    +'<div><small>Investissement</small><b class="num">'+xpf(inv)+'</b><small>'+equip.length+' équipements</small></div></div>'
    +'<div class="bar"><i style="width:'+Math.min(100,pct)+'%"></i></div>'
    +'<div class="foot"><span>'+done+' équipement'+(done>1?'s':'')+' amorti'+(done>1?'s':'')+' sur '+equip.length+'</span><b class="pct num">'+pct+' %</b></div></div>'
    +'<details class="more-d"><summary>Détail par équipement</summary><div class="list">'+rows+'</div></details>';
}
function viewLoc(){
  var rented=equip.filter(function(e){return e.st==='loc';});
  var rev=rented.reduce(function(a,e){return a+e.px;},0);
  var PC=['--accent','--ok','--info','--warn','--info'];
  var cards=patients.map(function(p,i){
    var it=rented.filter(function(e){return e.pt===p.id;});
    if(!it.length)return '';
    var sum=it.reduce(function(a,e){return a+e.px;},0);
    var back=it.some(function(e){return e.end===0;});
    return '<article class="pcard" style="--pc:var('+PC[i%PC.length]+')"><header><span class="avatar">'+initials(p.n)+'</span><div class="who"><div class="t">'+esc(p.n)+'</div><div class="s">'+esc(p.z)+'</div></div>'
      +(back?'<span class="pill p-loc">'+ic('ret')+'Retour auj.</span>':'<span class="pill p-dispo">'+ic('okc')+'Actif</span>')
      +'<div class="amt num">'+xpf(sum)+'<small>/ semaine</small></div></header>'
      +it.map(function(e){return '<button class="mini" data-open="'+e.id+'">'+ph(e)+'<span class="nm"><b>'+esc(e.n)+'</b><span class="when">'+ic('cal')+'Depuis '+(rent(e).el===0?'aujourd\'hui':sem(rent(e).el))+' · '+leftTxt(rent(e))+'</span><span class="bar'+(rent(e).left<0?' over':'')+'"><i style="width:'+rent(e).pct+'%"></i></span></span><span class="chev">'+ICON.chev+'</span></button>';}).join('')+'</article>';
  }).join('');
  var np=patients.filter(function(p){return rented.some(function(e){return e.pt===p.id;});}).length;
  return '<div class="stat2"><div class="st-a">'+ic('coins')+'<div><b class="num">'+xpf(rev)+'</b><span>Loyers par semaine</span></div></div><div>'+ic('users')+'<div><b class="num">'+np+'</b><span>Bénéficiaires équipés</span></div></div></div>'
    +'<section>'+secH('clip','Contrats en cours','<span>'+rented.length+' équipements</span>')+(cards||'<div class="list"><div class="empty">Aucune location en cours.</div></div>')+'</section>';
}
function rowE(e,sub,right){
  return '<button class="row" data-open="'+e.id+'">'+ph(e)+'<span class="body"><div class="t">'+esc(e.n)+'</div><div class="s si">'+ic('cal')+'<span>'+esc(sub)+'</span></div></span>'+right+'<span class="chev">'+ICON.chev+'</span></button>';
}
function viewEnt(){
  function block(k,t,arr,empty,sub){return '<section>'+secH(k,t,badge(arr.length))+'<div class="list">'+(arr.map(function(e){return rowE(e,sub(e),pill(e));}).join('')||'<div class="empty">'+empty+'</div>')+'</div></section>';}
  var de=equip.filter(function(e){return e.st==='desinf';}),ma=equip.filter(function(e){return e.st==='maint';});
  var ck=equip.filter(function(e){return e.chk<=30;}).sort(function(a,b){return a.chk-b.chk;});
  return '<div class="banner"><div>'+ic('tool')+'<div><b class="num">'+ck.length+'</b><span>Contrôles à venir</span></div></div><div>'+ic('warn')+'<div><b class="num">'+(de.length+ma.length)+'</b><span>Actions en cours</span></div></div></div>'
    +block('drop','Désinfection en attente',de,'Aucun matériel en zone de lavage.',function(e){return e.ref+' · retour '+rel(e.since).toLowerCase();})
    +block('tool','En maintenance',ma,'Aucun matériel à l\'atelier.',function(e){return e.ref+' · depuis le '+fmt(e.since);})
    +'<section>'+secH('cal','Prochains contrôles')+'<div class="list">'+(ck.map(function(e){
      var c=e.chk<0?['p-maint','clock','Retard '+(-e.chk)+' j']:e.chk<=14?['p-desinf','clock','Dans '+e.chk+' j']:['p-acc','cal',fmt(e.chk)];
      return rowE(e,e.ref+' · contrôle de sécurité','<span class="pill '+c[0]+'">'+ic(c[1])+c[2]+'</span>');}).join('')||'<div class="empty">Aucun contrôle dans les 30 jours.</div>')+'</div></section>';
}
var VIEWS={rap:['Analyse','Rapports',viewRap],home:['','Tableau de bord',viewHome],parc:['Inventaire','Parc matériel',viewParc],loc:['Patients','Locations',viewLoc],ent:['Atelier','Entretien',viewEnt]};
function render(keepScroll){
  var v=VIEWS[S.tab],y=main.scrollTop;
  var dt=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('subt').hidden=S.tab!=='home';$('subt').textContent='Vue d\'ensemble de votre parc de location';$('ndot').hidden=!alerts().length;
  if(v[0])$('eyebrow').textContent=v[0];else $('eyebrow').innerHTML=ic('cal')+esc(dt.charAt(0).toUpperCase()+dt.slice(1));
  $('top').className='top pad'+(S.tab==='home'?' home':'');
  $('eyebrow').className='eyebrow'+(v[0]?' up':'');
  $('title').textContent=v[1];
  main.innerHTML=v[2]();
  main.scrollTop=keepScroll?y:0;
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){if(tabs[i].dataset.tab===S.tab)tabs[i].setAttribute('aria-current','page');else tabs[i].removeAttribute('aria-current');}
}

function openDetail(id){S.cur=id;renderDetail();detail.classList.add('open');detail.setAttribute('aria-hidden','false');}
function closeDetail(){detail.classList.remove('open');detail.setAttribute('aria-hidden','true');S.cur=null;render(true);}

/* ---------- Feuilles ---------- */
function openSheet(html){sheet.innerHTML='<div class="grab"></div>'+html;sheet.classList.add('open');scrim.classList.add('open');}
function closeSheet(){sheet.style.height='';timers.forEach(clearTimeout);timers=[];sheet.classList.remove('open');scrim.classList.remove('open');}
/* ---------- Puces NFC : chaque puce porte un lien (enregistrement NDEF de type URI) ---------- */
var LKEY='mediparc-liens',BKEY='mediparc-base',DEFBASE='https://manaprocess.cloud/materiel/',OLDBASE='https://claude.ai/artifact/GzLtKdSYdmEHSFtsnMWLQ2#';
var base=DEFBASE,settingsEl=$('settings'),setOpen=false,tagId=null,pendingLink=null,linkTarget=null;
try{base=localStorage.getItem(BKEY)||DEFBASE;}catch(x){}
if(base===OLDBASE)base=DEFBASE; /* ancienne adresse par défaut */
function defLink(e){return base+e.ref;}
equip.forEach(function(e){e.link=defLink(e);});
try{var saved=JSON.parse(localStorage.getItem(LKEY)||'{}');equip.forEach(function(e){if(e.id in saved)e.link=saved[e.id]===OLDBASE+e.ref?defLink(e):saved[e.id];});}catch(x){}
function saveLinks(){try{var m={};equip.forEach(function(e){m[e.id]=e.link;});localStorage.setItem(LKEY,JSON.stringify(m));localStorage.setItem(BKEY,base);}catch(x){}}
function shortLink(u){return u.replace(/^https?:\/\//,'');}
/* Affichage compact : on garde le début et la fin, là où se trouve la référence. */
function midLink(u){u=shortLink(u);return u.length>36?u.slice(0,17)+'…'+u.slice(-17):u;}
function normUrl(v){
  v=String(v).trim();if(!v||/\s/.test(v))return null;
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(v))v='https://'+v;
  try{var u=new URL(v);return /^https?:$/.test(u.protocol)&&u.hostname.indexOf('.')>0?v:null;}catch(x){return null;}
}
function sameLink(a,b){var k=function(u){return String(u).trim().replace(/\/+$/,'').toLowerCase();};return k(a)===k(b);}
/* Retrouve l'équipement d'un lien : lien identique, sinon lien qui se termine par la référence (…/LIT-0142, …#LIT-0142). */
function findByLink(u){
  var e=equip.filter(function(x){return x.link&&sameLink(x.link,u);})[0];
  if(e)return e;
  var m=String(u).trim().match(/[#\/=]([A-Za-z]{3}-\d{4})\/?$/);
  return m?equip.filter(function(x){return x.link&&x.ref===m[1].toUpperCase();})[0]:null;
}
function nativeNfc(){return window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.nfc;}
function radarSheet(t,sub){
  openSheet('<h2 id="scan-t">'+t+'</h2><p class="sub" id="scan-s">'+sub+'</p>'
    +'<div class="radar" id="radar"><span></span><span></span><span></span><div class="core" id="core">'+ICON.nfc+'</div></div>'
    +'<button class="btn soft" data-act="close-sheet">Annuler</button>');
}
/* Dans l'app iOS, lecture et écriture passent par Core NFC ; ailleurs (navigateur, simulateur) elles sont simulées. */
function startScan(){linkTarget=null;var n=nativeNfc();if(n){n.postMessage({action:'read'});}else simScan();}
function simScan(){
  radarSheet('Prêt à scanner','Approchez le haut de l\'iPhone de la puce collée sur l\'équipement.');
  timers.push(setTimeout(function(){
    var withTag=equip.filter(function(x){return x.link;});
    if(!withTag.length){closeSheet();toast('Aucun équipement n\'a encore de puce');return;}
    var e=byId(scanOrder[scanIdx++%scanOrder.length]);if(!e.link)e=withTag[0];
    $('radar').classList.add('found');$('core').innerHTML=e.ph?'<img src="'+src(e)+'" alt="">':ICON.check;
    $('scan-t').textContent='Puce reconnue';$('scan-s').textContent=e.n+' · '+e.ref;
    timers.push(setTimeout(function(){closeSheet();openDetail(e.id);},850));
  },1900));
}
function assignLink(e,u){
  equip.forEach(function(o){if(o!==e&&o.link&&sameLink(o.link,u)){o.link='';o.h.push(ev(0,'Puce NFC réattribuée à '+e.ref));}});
  e.link=u;e.h.push(ev(0,'Puce NFC associée'));saveLinks();closeSheet();if(setOpen)renderSettings();else openDetail(e.id);toast('Puce associée à '+e.ref);
}
/* Lire le lien déjà présent sur une puce et l'associer à l'équipement. */
function readTagFor(id){
  linkTarget=id;var n=nativeNfc();if(n){n.postMessage({action:'read'});return;}
  var e=byId(id);radarSheet('Lire une puce','Approchez la puce à associer à : '+esc(e.n)+'.');
  timers.push(setTimeout(function(){linkTarget=null;$('radar').classList.add('found');$('core').innerHTML=ICON.check;$('scan-t').textContent='Lien lu';$('scan-s').textContent=shortLink(defLink(e));
    timers.push(setTimeout(function(){assignLink(e,defLink(e));},850));},1900));
}
/* Écrire le lien de l'équipement sur une puce. */
function writeTagFor(id){
  var e=byId(id),u=e.link||defLink(e),n=nativeNfc();linkTarget=id;
  if(n){n.postMessage({action:'write',url:u});return;}
  radarSheet('Écrire la puce','Approchez la puce à coller sur : '+esc(e.n)+'.');
  timers.push(setTimeout(function(){linkTarget=null;$('radar').classList.add('found');$('core').innerHTML=ICON.check;$('scan-t').textContent='Lien écrit';$('scan-s').textContent=shortLink(u);
    timers.push(setTimeout(function(){assignLink(e,u);},850));},1900));
}
window.onNfcUnavailable=function(){var t=linkTarget;linkTarget=null;if(t)toast('NFC indisponible sur cet appareil');else simScan();};
window.onNfcCancelled=function(){linkTarget=null;};
window.onNfcError=function(msg){linkTarget=null;toast(msg||'Lecture impossible');};
window.onNfcWritten=function(u){var e=byId(linkTarget);linkTarget=null;if(e)assignLink(e,u);};
window.onNfcLink=function(u){
  var t=linkTarget?byId(linkTarget):null;linkTarget=null;
  if(t){
    if(u){assignLink(t,u);return;}
    tagId=t.id;
    openSheet('<h2>Puce vierge</h2><p class="sub">Cette puce ne contient pas encore de lien. Écrire celui de '+esc(t.n)+' ?</p><button class="btn" data-act="write-tag">'+ICON.nfc+'Écrire le lien sur la puce</button><button class="btn soft" data-act="close-sheet">Annuler</button>');
    return;
  }
  if(!u){toast('Cette puce ne contient pas de lien');return;}
  var e=findByLink(u);
  if(e){closeSheet();openDetail(e.id);toast('Puce reconnue · '+e.ref);return;}
  pendingLink=u;
  openSheet('<h2>Lien inconnu</h2><p class="sub"><code>'+esc(shortLink(u))+'</code><br>Choisissez l\'équipement auquel associer cette puce.</p><div class="plist">'+equip.map(function(x){
    return '<button class="pick" data-link="'+x.id+'">'+ph(x)+'<span class="body"><div class="t">'+esc(x.n)+'</div><div class="s">'+x.ref+'</div></span></button>';}).join('')
    +'</div><button class="btn soft" data-act="close-sheet">Annuler</button>');
};
function copyText(t,ok){try{navigator.clipboard.writeText(t).then(function(){toast(ok);},function(){toast(t);});}catch(z){toast(t);}}

/* ---------- Paramètres : association des puces réelles ---------- */
function renderSettings(){
  var n=equip.filter(function(e){return e.link;}).length;
  settingsEl.innerHTML='<div class="sbar pad"><button class="back" data-act="close-settings" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><h2>Paramètres</h2></div>'
    +'<div class="dscroll"><div class="sbody pad">'
    +'<div class="banner"><div>'+ic('tag')+'<div><b class="num">'+n+' / '+equip.length+'</b><span>Équipements avec puce</span></div></div><div>'+ic('warn')+'<div><b class="num">'+(equip.length-n)+'</b><span>Sans puce</span></div></div></div>'
    +'<p class="note">Chaque puce contient un lien propre à son équipement. Touchez un équipement pour écrire son lien sur une vraie puce, lire une puce déjà programmée ou saisir le lien à la main.</p>'
    +'<section>'+secH('tag','Puces NFC')+'<div class="list">'+equip.map(function(e){
      return '<button class="row" data-tag="'+e.id+'">'+ph(e)+'<span class="body"><div class="t">'+esc(e.n)+'</div><div class="s lk">'+(e.link?'<code>'+esc(midLink(e.link))+'</code>':e.ref)+'</div></span>'
        +(e.link?'':'<span class="pill p-desinf">À associer</span>')+'<span class="chev">'+ICON.chev+'</span></button>';}).join('')+'</div></section>'
    +'<section>'+secH('arrow','Adresse des liens')+'<p class="note">Début commun des liens. La référence de l\'équipement est ajoutée à la fin, par exemple <code>'+esc(shortLink(base))+'LIT-0142</code>.</p>'
    +'<div class="uidrow"><input class="uid" id="base-in" type="url" inputmode="url" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Adresse de base des liens" value="'+esc(base)+'"><button class="btn" data-act="save-base">Appliquer</button></div><p class="err" id="base-err" hidden></p></section>'
    +'<section>'+secH('gear','Démonstration')+'<div class="stack"><button class="btn" data-act="scan">'+ICON.nfc+'Tester une puce</button>'
    +'<button class="btn soft" data-act="clear-all">Effacer toutes les puces</button><button class="btn soft" data-act="restore-all">Rétablir les liens par défaut</button></div>'
    +'<p class="note">Patients, tarifs, adresses et historique sont des données de démonstration.</p></section></div></div>';
}
function openSettings(){setOpen=true;renderSettings();settingsEl.classList.add('open');settingsEl.setAttribute('aria-hidden','false');}
function closeSettings(){setOpen=false;settingsEl.classList.remove('open');settingsEl.setAttribute('aria-hidden','true');render(true);}
function openTag(id){
  tagId=id;var e=byId(id);
  openSheet('<h2>'+esc(e.n)+'</h2><p class="sub">'+e.ref+(e.link?'':' · aucune puce')+'</p>'
    +'<label class="fld" for="uid-in">Lien de la puce</label><div class="uidrow"><input class="uid" id="uid-in" type="url" inputmode="url" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="'+esc(defLink(e))+'" value="'+esc(e.link)+'"><button class="btn" data-act="save-uid">Enregistrer</button></div>'
    +'<p class="err" id="uid-err" hidden></p>'
    +'<button class="btn" data-act="write-tag">'+ICON.nfc+'Écrire le lien sur une puce</button>'
    +'<button class="btn soft" data-act="scan-tag">Lire une puce déjà programmée</button>'
    +'<button class="btn soft" data-act="copy-link">Copier le lien</button>'
    +(e.link?'<button class="btn danger" data-act="clear-tag">Retirer la puce</button>':'')
    +'<button class="btn soft" data-act="close-sheet">Fermer</button>');
  sheet.style.height='88%';
}
function saveUid(){
  var u=normUrl($('uid-in').value),err=$('uid-err');
  if(!u){err.textContent='Lien non reconnu. Saisissez une adresse web complète, par exemple '+defLink(byId(tagId))+'.';err.hidden=false;return;}
  assignLink(byId(tagId),u);
}
function saveBase(){
  var u=normUrl($('base-in').value),err=$('base-err');
  if(!u){err.textContent='Adresse non reconnue. Exemple : https://manaprocess.cloud/materiel/';err.hidden=false;return;}
  if(!/[\/#=]$/.test(u))u+='/';
  equip.forEach(function(e){if(e.link&&sameLink(e.link,defLink(e)))e.link=u+e.ref;});
  base=u;saveLinks();renderSettings();toast('Adresse des liens mise à jour');
}
function menuSheet(title,items){
  openSheet('<h2>'+title+'</h2><div class="menu">'+items.map(function(m){return '<button '+m[0]+'><svg viewBox="0 0 24 24">'+ICON[m[1]]+'</svg><span>'+m[2]+'<small>'+m[3]+'</small></span></button>';}).join('')+'</div><button class="btn soft" data-act="close-sheet">Fermer</button>');
}
function quickSheet(){menuSheet('Actions rapides',[['data-act="scan"','tag','Scanner une puce NFC','Ouvrir la fiche d\'un équipement'],['data-filter="dispo"','cal','Mettre en location','Choisir un équipement disponible'],['data-tab="loc"','ret','Enregistrer un retour','Depuis les contrats en cours'],['data-tab="ent"','drop','Valider une désinfection','Matériel en attente']]);}
function moreSheet(){menuSheet('Plus',[['data-act="settings"','gear','Paramètres','Puces NFC et adresse des liens'],['data-mode="plan"','pin','Plan du matériel','Où se trouve chaque équipement'],['data-tab="rap"','bars','Rapports','Rentabilité et activité'],['data-act="credits"','clip','Crédits photos','Auteurs et licences']]);}
function openState(st){
  var it=equip.filter(function(e){return e.st===st;});
  openSheet('<h2>'+STATUS[st].l+' · '+it.length+'</h2><div class="list">'+(it.map(function(e){return rowEq(e);}).join('')||'<div class="empty">Aucun équipement dans cet état.</div>')
    +'</div><button class="btn soft" data-filter="'+st+'">Voir dans le parc</button>');
}
/* Lien ouvert directement (puce scannée hors de l'app) : …/materiel/LIT-0101 ou …#LIT-0101 ouvre la fiche. */
function openFromHash(){var r=decodeURIComponent(location.hash.slice(1)||location.pathname.replace(/\/+$/,'').split('/').pop()).toUpperCase();var e=equip.filter(function(x){return x.ref===r;})[0];if(e)openDetail(e.id);}
window.addEventListener('hashchange',openFromHash);
var DURS=[[7,'1 semaine'],[14,'2 semaines'],[28,'4 semaines'],[90,'3 mois']],rentDur=28;
function pickPatient(){
  openSheet('<h2>Mettre en location</h2><label class="fld" style="text-align:center">Durée prévue</label><div class="durs">'+DURS.map(function(d){
      return '<button class="chip" data-dur="'+d[0]+'" aria-pressed="'+(rentDur===d[0])+'">'+d[1]+'</button>';}).join('')+'</div>'
    +'<label class="fld" style="text-align:center">Bénéficiaire</label><div class="plist">'+patients.map(function(p){
    return '<button class="pick" data-pick="'+p.id+'"><span class="avatar">'+initials(p.n)+'</span><span class="body"><div class="t">'+esc(p.n)+'</div><div class="s">'+esc(p.z)+'</div></span></button>';}).join('')
    +'</div><button class="btn soft" data-act="close-sheet">Annuler</button>');
}

var toastT;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show');},2200);}

/* ---------- Actions ---------- */
function act(a,e){
  if(a==='return'){var n=pat(e.pt).n;e.st='desinf';e.pt=null;e.end=null;e.since=0;e.h.push(ev(0,'Retour de location ('+n+'), en attente de désinfection'));toast('Retour enregistré');}
  else if(a==='clean'){e.st='dispo';e.since=0;e.h.push(ev(0,'Désinfection validée, remis en stock'));toast('Désinfection validée');}
  else if(a==='repair'){e.st='dispo';e.since=0;if(e.chk<0)e.chk=365;e.h.push(ev(0,'Maintenance clôturée, contrôle conforme'));toast('Matériel remis en stock');}
  else if(a==='fault'){e.st='maint';e.pt=null;e.end=null;e.since=0;e.h.push(ev(0,'Panne signalée, envoyé à l\'atelier'));toast('Panne signalée');}
  renderDetail();
}
document.addEventListener('click',function(x){
  var t=x.target.closest('[data-tab],[data-open],[data-act],[data-filter],[data-pick],[data-link],[data-place],[data-mode],[data-state],[data-tag],[data-map],[data-dur],[data-hist]');if(!t)return;
  var d=t.dataset;
  if(d.hist){histDays=+d.hist;render(true);}
  else if(d.act==='quick')quickSheet();
  else if(d.act==='more')moreSheet();
  else if(d.act==='alerts')openSheet('<h2>À traiter · '+alerts().length+'</h2><div class="list">'+alertRows(alerts())+'</div><button class="btn soft" data-act="close-sheet">Fermer</button>');
  else if(d.act==='search'){closeSheet();S.tab='parc';S.mode='grid';render();var qi=$('q');if(qi)qi.focus();}
  else if(d.dur){rentDur=+d.dur;pickPatient();}
  else if(d.act==='extend'){var xe=byId(S.cur);xe.end+=7;xe.h.push(ev(0,'Location prolongée d\'une semaine'));renderDetail();toast('Retour repoussé au '+fmt(xe.end));}
  else if(d.map){openMap(d.map);}
  else if(d.tag){openTag(d.tag);}
  else if(d.act==='settings'){closeSheet();openSettings();}
  else if(d.act==='close-settings')closeSettings();
  else if(d.act==='save-uid')saveUid();
  else if(d.act==='scan-tag'){var tg=tagId;closeSheet();readTagFor(tg);}
  else if(d.act==='write-tag'){var tw=tagId;closeSheet();writeTagFor(tw);}
  else if(d.act==='copy-link'){var ke=byId(tagId);copyText(ke.link||defLink(ke),'Lien copié');}
  else if(d.act==='save-base')saveBase();
  else if(d.act==='clear-tag'){var ce=byId(tagId);ce.link='';ce.h.push(ev(0,'Puce NFC retirée'));saveLinks();closeSheet();renderSettings();toast('Puce retirée de '+ce.ref);}
  else if(d.act==='clear-all'){equip.forEach(function(e){e.link='';});saveLinks();renderSettings();toast('Toutes les puces sont effacées');}
  else if(d.act==='restore-all'){equip.forEach(function(e){e.link=defLink(e);});saveLinks();renderSettings();toast('Liens par défaut rétablis');}
  else if(d.state){openState(d.state);}
  else if(d.place){var same=S.tab==='parc'&&S.mode==='plan';S.place=d.place;S.tab='parc';S.mode='plan';render(same);}
  else if(d.mode){closeSheet();S.mode=d.mode;S.tab='parc';render();}
  else if(d.tab){closeSheet();S.tab=d.tab;render();}
  else if(d.link){var lu=pendingLink;pendingLink=null;assignLink(byId(d.link),lu);}
  else if(d.open){closeSheet();openDetail(d.open);}
  else if(d.filter){closeSheet();S.filter=d.filter;S.mode='grid';S.tab='parc';render();}
  else if(d.pick){var e=byId(S.cur),p=pat(d.pick);e.st='loc';e.pt=p.id;e.since=0;e.end=rentDur;e.h.push(ev(0,'Livré chez '+p.n+' pour '+DURS.filter(function(x){return x[0]===rentDur;})[0][1]));closeSheet();renderDetail();toast('Location démarrée');}
  else if(d.act==='scan'){closeSheet();startScan();}
  else if(d.act==='close-sheet')closeSheet();
  else if(d.act==='credits')openSheet('<h2>Crédits photos</h2><p class="sub">Photos d\'illustration libres (Wikimedia Commons, Flickr), redimensionnées. Elles ne montrent pas les modèles exacts.</p><div class="plist">'+CREDITS.map(function(c){return '<div class="cred"><b>'+c[0]+'</b><span>'+c[1]+' · '+c[2]+'</span></div>';}).join('')+'</div><button class="btn soft" data-act="close-sheet">Fermer</button>');
  else if(d.act==='back')closeDetail();
  else if(d.act==='copy'){var cl=byId(S.cur).link;if(cl)copyText(cl,'Lien copié');else toast('Aucune puce associée');}
  else if(d.act==='assign')pickPatient();
  else if(d.act==='program')writeTagFor(S.cur);
  else if(S.cur)act(d.act,byId(S.cur));
});
document.addEventListener('input',function(x){if(x.target.id==='q'){S.q=x.target.value;$('parc-list').innerHTML=parcRows();}});
document.addEventListener('keydown',function(x){if(x.key==='Enter'&&x.target.id==='uid-in'){saveUid();return;}if(x.key==='Enter'&&x.target.id==='base-in'){saveBase();return;}if(x.key==='Escape'){if(sheet.classList.contains('open'))closeSheet();else if(S.cur)closeDetail();else if(setOpen)closeSettings();}});
render();
openFromHash();
})();
</script>
</body>
