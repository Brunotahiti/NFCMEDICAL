# Sert la démo MédiParc sur https://manaprocess.cloud/materiel/
# Prévu pour un VPS où Traefik publie déjà manaprocess.cloud (modèle n8n de Hostinger).
# À ADAPTER avant usage : le nom du réseau, du point d'entrée et du résolveur de certificat
# doivent être ceux du docker-compose déjà en place sur le serveur.
services:
  mediparc:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.mediparc.rule=Host(`manaprocess.cloud`) && PathPrefix(`/materiel`)
      - traefik.http.routers.mediparc.entrypoints=websecure
      - traefik.http.routers.mediparc.tls=true
      - traefik.http.routers.mediparc.tls.certresolver=mytlschallenge
      - traefik.http.services.mediparc.loadbalancer.server.port=80
    networks:
      - web

networks:
  web:
    external: true
    name: root_default
