# Sert la démo MédiParc sur https://manaprocess.cloud/materiel/ derrière le Traefik du VPS.
# L'image est construite sur le serveur, directement depuis le dépôt GitHub (qui doit être public).
services:
  site:
    build:
      context: https://github.com/Brunotahiti/NFCMEDICAL.git#claude/bold-gates-7zd8o7
      dockerfile: deploy/Dockerfile
    image: mediparc-nfc:latest
    container_name: mediparc-nfc
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.mediparc-nfc.rule=Host(`manaprocess.cloud`) && PathPrefix(`/materiel`)"
      - "traefik.http.routers.mediparc-nfc.entrypoints=websecure"
      - "traefik.http.routers.mediparc-nfc.tls=true"
      - "traefik.http.routers.mediparc-nfc.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mediparc-nfc.priority=100"
      - "traefik.http.services.mediparc-nfc.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
    name: traefik
