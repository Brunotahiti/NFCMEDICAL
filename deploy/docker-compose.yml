# Sert la démo MédiParc sur https://manaprocess.cloud/materiel/ derrière le Traefik du VPS.
# Au démarrage, le conteneur télécharge le site depuis le dépôt GitHub public :
# redémarrer le projet « mediparc-nfc » suffit pour mettre le site à jour.
services:
  site:
    image: nginx:1.27-alpine
    container_name: mediparc-nfc
    restart: unless-stopped
    mem_limit: 64m
    command:
      - sh
      - -c
      - |
        set -e
        cd /tmp
        wget -qO src.tgz https://codeload.github.com/Brunotahiti/NFCMEDICAL/tar.gz/refs/heads/claude/bold-gates-7zd8o7
        rm -rf src && mkdir src && tar xzf src.tgz -C src --strip-components=1
        sh src/deploy/build.sh
        rm -rf /usr/share/nginx/html/materiel
        cp -r src/deploy/site/materiel /usr/share/nginx/html/materiel
        cp src/deploy/nginx.conf /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.mediparc-nfc.rule=Host(`manaprocess.cloud`) && PathPrefix(`/materiel`)"
      - "traefik.http.routers.mediparc-nfc.entrypoints=websecure"
      - "traefik.http.routers.mediparc-nfc.tls=true"
      - "traefik.http.routers.mediparc-nfc.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mediparc-nfc.priority=100"
      - "traefik.http.services.mediparc-nfc.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
    name: traefik
