# MédiParc NFC sur https://manaprocess.cloud/materiel/ (VPS Hostinger, derrière Traefik).
# Au démarrage, le conteneur télécharge ce dépôt (public), génère le site et lance le serveur.
# Les données (base SQLite, ordonnances, sauvegardes quotidiennes) sont dans le volume « mediparc-data ».
# ADMIN_PASSWORD n'est lu qu'au tout premier démarrage (création du compte « admin ») ;
# il est fourni par les variables du projet sur le VPS, jamais par ce dépôt.
services:
  app:
    image: node:22-alpine
    container_name: mediparc-nfc
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - TZ=Pacific/Tahiti
      - PORT=3000
      - DATA_DIR=/data
      - SITE_DIR=/app/deploy/site/materiel
      - PUBLIC_URL=https://manaprocess.cloud/materiel/
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - mediparc-data:/data
    command:
      - sh
      - -c
      - |
        set -e
        cd /tmp
        wget -qO src.tgz https://codeload.github.com/Brunotahiti/NFCMEDICAL/tar.gz/refs/heads/claude/bold-gates-7zd8o7
        rm -rf /app && mkdir -p /app && tar xzf src.tgz -C /app --strip-components=1
        cd /app && sh deploy/build.sh
        exec node --disable-warning=ExperimentalWarning server/server.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/materiel/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.mediparc-nfc.rule=Host(`manaprocess.cloud`) && PathPrefix(`/materiel`)"
      - "traefik.http.routers.mediparc-nfc.entrypoints=websecure"
      - "traefik.http.routers.mediparc-nfc.tls=true"
      - "traefik.http.routers.mediparc-nfc.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mediparc-nfc.priority=100"
      - "traefik.http.routers.mediparc-nfc.middlewares=mediparc-headers"
      - "traefik.http.middlewares.mediparc-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.mediparc-headers.headers.contentTypeNosniff=true"
      - "traefik.http.services.mediparc-nfc.loadbalancer.server.port=3000"

volumes:
  mediparc-data:

networks:
  traefik:
    external: true
    name: traefik
