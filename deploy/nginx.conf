server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # /materiel/LIT-0101 n'est pas un fichier : on sert la page, qui ouvre la fiche LIT-0101.
    location /materiel/ {
        try_files $uri /materiel/index.html;
    }
    location = /materiel {
        return 301 /materiel/;
    }
}
